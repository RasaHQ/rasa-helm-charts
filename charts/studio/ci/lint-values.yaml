# Minimum values for linting. charts/studio has no default database host — the
# chart cannot be installed without one, so the schema rejects an unset value.
# The same holds for the ingress host while the Rasa Pro subchart is enabled:
# the model service's STUDIO_TOKEN_ISSUER is derived from it.
# `helm lint`/`ct lint` render against defaults, so they need this file supplied.
global:
  ingressHost: "studio.example.com"
config:
  database:
    host: "postgres.example.com"
