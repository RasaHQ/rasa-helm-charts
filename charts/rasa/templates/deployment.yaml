{{- include "rasa.validateApiExposure" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rasa.fullname" . }}
  labels:
    {{- include "rasa.labels" . | nindent 4 }}
    {{- if .Values.deploymentLabels }}
      {{- toYaml .Values.deploymentLabels | nindent 4 }}
    {{- end }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.rasa.autoscaling.enabled }}
  replicas: {{ .Values.rasa.replicaCount }}
  {{- end }}
  {{- if .Values.rasa.strategy }}
  strategy:
    {{- toYaml .Values.rasa.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rasa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- if .Values.rasa.podAnnotations }}
        {{- toYaml .Values.rasa.podAnnotations | nindent 8 }}
      {{- end }}
      labels:
        {{- include "rasa.selectorLabels" . | nindent 8 }}
        {{- if .Values.podLabels }}
          {{- toYaml .Values.podLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.hostAliases }}
      hostAliases:
        {{- toYaml .Values.hostAliases | nindent 8 }}
      {{- end }}
      hostNetwork: {{ .Values.hostNetwork }}
      dnsPolicy: {{ include "rasa.dnsPolicy" . }}
      {{- if .Values.dnsConfig }}
      dnsConfig:
        {{ toYaml .Values.dnsConfig | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rasa.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.rasa.automountServiceAccountToken }}
      {{- if .Values.rasa.podSecurityContext.enabled }}
      securityContext:
        {{- omit .Values.rasa.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      {{- if not (kindIs "invalid" .Values.rasa.terminationGracePeriodSeconds) }}
      terminationGracePeriodSeconds: {{ .Values.rasa.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if .Values.rasa.initContainers }}
      initContainers:
        {{- toYaml .Values.rasa.initContainers | nindent 8 }}
      {{- end }}
      containers:
        - name: rasa
          {{- if .Values.rasa.containerSecurityContext.enabled }}
          securityContext:
            {{- omit .Values.rasa.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          image: "{{ .Values.rasa.image.repository }}:{{ .Values.rasa.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.rasa.image.pullPolicy }}
          {{- /*
          Tests for args being absent, not falsy: `args: []` and an unset args are
          both falsy but mean different things — no arguments, versus generate them.
          */}}
          {{- if not (kindIs "invalid" .Values.rasa.args) }}
          {{- with .Values.rasa.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- else }}
          args:
            {{- include "rasa.defaultArgs" . | nindent 12 }}
          {{- if .Values.rasa.extraArgs }}
            {{- toYaml .Values.rasa.extraArgs | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- if .Values.rasa.command }}
          command:
            {{- toYaml .Values.rasa.command | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.rasa.port }}
              protocol: TCP
          {{- if .Values.rasa.env }}
          env:
            {{- toYaml .Values.rasa.env | nindent 12 }}
          {{- else }}
          env:
            {{- include "rasa.containers.env" . | trim | nindent 12 }}
          {{- end }}
          {{- if .Values.rasa.envFrom }}
          envFrom:
            {{- toYaml .Values.rasa.envFrom | nindent 12 }}
          {{- end }}
          {{- if .Values.rasa.livenessProbe.enabled }}
          livenessProbe:
            {{- $probe := omit .Values.rasa.livenessProbe "enabled" | deepCopy }}
            {{- if and $probe.httpGet (not $probe.httpGet.port) }}
            {{- $_ := set $probe.httpGet "port" $.Values.rasa.port }}
            {{- end }}
            {{- if and $probe.tcpSocket (not $probe.tcpSocket.port) }}
            {{- $_ := set $probe.tcpSocket "port" $.Values.rasa.port }}
            {{- end }}
            {{- toYaml $probe | nindent 12 }}
          {{- end }}
          {{- if .Values.rasa.readinessProbe.enabled }}
          readinessProbe:
            {{- $probe := omit .Values.rasa.readinessProbe "enabled" | deepCopy }}
            {{- if and $probe.httpGet (not $probe.httpGet.port) }}
            {{- $_ := set $probe.httpGet "port" $.Values.rasa.port }}
            {{- end }}
            {{- if and $probe.tcpSocket (not $probe.tcpSocket.port) }}
            {{- $_ := set $probe.tcpSocket "port" $.Values.rasa.port }}
            {{- end }}
            {{- toYaml $probe | nindent 12 }}
          {{- end }}
          {{- with .Values.rasa.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.rasa.resources | nindent 12 }}
          {{- $volumeMounts := include "rasa.containers.volumeMounts" . | trim }}
          {{- if or $volumeMounts .Values.rasa.extraVolumeMounts }}
          volumeMounts:
            {{- with $volumeMounts }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- if .Values.rasa.extraVolumeMounts }}
            {{- toYaml .Values.rasa.extraVolumeMounts | nindent 12 }}
          {{- end }}
          {{- end }}
      {{- if .Values.rasa.extraContainers }}
        {{- toYaml .Values.rasa.extraContainers | nindent 8 }}
      {{- end }}
      {{- $volumes := include "rasa.containers.volumes" . | trim }}
      {{- if or $volumes .Values.rasa.extraVolumes }}
      volumes:
        {{- with $volumes }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- if .Values.rasa.extraVolumes }}
        {{- toYaml .Values.rasa.extraVolumes | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.rasa.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rasa.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rasa.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rasa.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- include "rasa.topologySpreadConstraints" (dict "constraints" . "selectorLabels" (include "rasa.selectorLabels" $)) | nindent 8 }}
      {{- end }}
