{{- if .Values.app.authSecret.generate }}
{{- $name := include "studio.app.authSecretName" . }}
{{- $key := .Values.app.authSecret.secretKey }}
{{- /*
Reuse the value already in the cluster so an upgrade does not invalidate every
session. `lookup` returns an empty dict whenever Helm has no API server — that
covers `helm template`, `--dry-run`, and every GitOps renderer — so under those
this generates a fresh value each render. That is why `generate` defaults to
false; GitOps installs must supply the Secret themselves.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $value := "" }}
{{- if and $existing (hasKey ($existing.data | default dict) $key) }}
{{- $value = index $existing.data $key }}
{{- else }}
{{- $value = randAlphaNum 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "studio.labels" . | nindent 4 }}
    app.kubernetes.io/component: studio-app
  annotations:
    # Survive `helm uninstall` so a reinstall keeps existing sessions valid.
    # Helm stamps the ownership metadata it needs to re-adopt this on install.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $value | quote }}
{{- end }}
