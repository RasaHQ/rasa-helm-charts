apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "studio.fullname" . }}-test-connection"
  labels:
    {{- include "studio.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  automountServiceAccountToken: false
  containers:
    - name: wget
      image: busybox
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        # busybox has no baked-in non-root user; 65534 is nobody, which is all `wget` needs.
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      command: ['wget']
      args: ['{{ include "studio.fullname" . }}-app:{{ .Values.app.service.port }}']
  restartPolicy: Never
