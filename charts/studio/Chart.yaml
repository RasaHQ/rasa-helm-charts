apiVersion: v2
name: studio
description: A Rasa Studio Helm chart for Kubernetes
type: application
# Minimum Kubernetes version. Mirrors the rasa subchart's floor -- Helm does not
# enforce a subchart's kubeVersion, so it has to be repeated here. The `-0`
# suffix lets pre-release cluster versions satisfy the constraint.
kubeVersion: ">=1.31.0-0"
version: 3.0.0-rc.62
appVersion: "2.0.0-latest"
home: https://helm.rasa.com
sources:
  - https://github.com/RasaHQ/rasa-helm-charts/tree/main/charts/studio
keywords:
  - Kubernetes
  - Studio
  - CALM
maintainers:
  - name: Rasa Infrastructure and Security Team
    url: https://github.com/RasaHQ/rasa-helm-charts
    email: support@rasa.com
dependencies:
  - name: rasa
    condition: rasa.enabled
    repository: oci://europe-west3-docker.pkg.dev/rasa-releases/helm-charts
    version: 3.0.0-rc.22
