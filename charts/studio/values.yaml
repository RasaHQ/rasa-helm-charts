# Default values for studio.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- (string) Override name of app
nameOverride: ""
# -- (string) Override the full qualified app name
fullnameOverride: ""

# -- imagePullSecret defines repository pull secrets
imagePullSecrets: []
  # - name: regcred

# -- repository specifies image repository for Studio
repository: "europe-west3-docker.pkg.dev/rasa-releases/studio/"
# -- tag specifies image tag for Studio (unified studio image; Studio ≥ 2.0.0).
# Placeholder until the first published unified tag is confirmed for promotion.
tag: "2.0.0-latest"

config:
  # -- Defines the host name for all Studio ingress resources.
  # This value is used as an anchor (&dns_hostname) for referencing the host name across multiple places in the Helm chart.
  # WARNING: Do NOT delete or modify the anchor (&dns_hostname) as it is critical for the proper functioning of the chart.
  # If you need to update the host name, only change the value (INGRESS.HOST.NAME), keeping the anchor intact.
  ingressHost: &dns_hostname INGRESS.HOST.NAME

  # -- Define the ingress annotations to be used for ALL the ingress resources.
  # These annotations will be applied to all ingress resources created by this chart.
  # Example:
  #   kubernetes.io/ingress.class: nginx
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  ingressAnnotations: {}

  # -- Define the ingress class name to be used for ALL the ingress resources.
  # This value will be applied to all ingress resources created by this chart.
  # Example: "nginx", "istio", "traefik"
  # Ref: https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class
  ingressClassName: ""

  # -- Define the URL scheme (`http` or `https`) for externally derived URLs
  # (ingress-based API_URL, WEB_CLIENT_URL, web client API_ENDPOINT, model-service
  # public URLs, CORS_ORIGINS, etc.). Valid values: "http" or "https".
  # Does not change in-cluster http:// service-to-service calls.
  connectionType: "http"

  # -- The postgres database instance details for Studio to connect to.
  # This section configures the database connection parameters for Studio.
  database:
    # -- The database host name or IP address where PostgreSQL is running.
    # Example: "postgres.example.com" or "10.0.0.1"
    host: ""
    # -- The database port number for PostgreSQL.
    # Default PostgreSQL port is 5432
    port: "5432"
    # -- The database username for Studio to connect with.
    # This user should have appropriate permissions on the database.
    # Can be specified as a plain string value or as a secret reference.
    # Plain value example: username: "studio"
    # Secret reference example:
    # username:
    #   secretName: "my-secret"
    #   secretKey: "DB_USERNAME"
    username: ""
    # -- The database password configuration.
    # This references a Kubernetes secret containing the database password.
    password:
      secretName: "studio-secrets"
      secretKey: "DATABASE_PASSWORD"
    # -- The database name for Keycloak user management service.
    # This is used by Keycloak to store its user management data.
    # Note: This must be a plain string value (not a secret reference) as it's used in JDBC URL construction.
    keycloakDatabaseName: "keycloak"
    # -- The database name for Studio app services.
    # This is used by Studio to store its data.
    # Can be specified as a plain string value or as a secret reference.
    # Plain value example: databaseName: "studio"
    # Secret reference example:
    # databaseName:
    #   secretName: "my-secret"
    #   secretKey: "DB_NAME"
    databaseName: "studio"
    # -- The database connection URL query parameters.
    # These parameters are used to configure the database connection.
    # Example: "sslmode=require&connect_timeout=30"
    queryParams: ""
    # -- Set to true if you want to use SSL for database connection.
    # When enabled, Studio will attempt to establish an encrypted connection to the database.
    preferSSL: "true"
    # -- If true, the server will reject database connections which are not present in the list of supplied CAs.
    # This provides additional security by ensuring only trusted certificates are accepted.
    rejectUnauthorized: ""
    # -- Set to true if you want to use AWS IAM authentication for the database.
    useAwsIamAuth: ""
    # -- The AWS region for the database. Needed if you want to use AWS IAM authentication for the database.
    awsRegion: ""
    # -- The IAM database username for the database. Needed if you want to use AWS IAM authentication for the database.
    iamDbUsername: ""

  # -- config.keycloak defines the Keycloak configuration settings.
  # This section configures the authentication and authorization service.
  # Note: Keycloak is retained to support migration of existing data to the new app's internal authentication.
  keycloak:
    # -- config.keycloak.url overrides the default service endpoint for Keycloak.
    # Format is `http(s)://<ingressHost>/auth`.
    # Required only if your cluster redirects internal HTTP traffic to HTTPS.
    url: ""
    # -- config.keycloak.adminUsername is the admin username for Keycloak.
    # This username is used to login to the Keycloak admin console.
    adminUsername: "kcadmin"
    # -- config.keycloak.adminPassword defines the admin password for Keycloak.
    # This password is used to login to the Keycloak admin console.
    # The password is stored in a Kubernetes secret.
    adminPassword:
      secretName: "studio-secrets"
      secretKey: "KEYCLOAK_ADMIN_PASSWORD"
    # -- config.keycloak.realm is the realm name for Keycloak.
    # This realm is used by Studio to manage users and clients.
    realm: "rasa-studio"
    # -- config.keycloak.clientId is the client ID for Keycloak.
    # This client is used by Studio to authenticate with Keycloak.
    clientId: "rasa-studio-backend"
    # -- config.keycloak.apiClientId is the client ID for Keycloak API.
    # This client is used by Studio App to authenticate with Keycloak.
    apiClientId: "admin-cli"
    # -- config.keycloak.apiUsername is the username for Keycloak API.
    # This username is used by Studio App to authenticate with Keycloak.
    apiUsername: "realmadmin"
    # -- config.keycloak.apiPassword is the password for Keycloak API.
    # This password is used by Studio App to authenticate with Keycloak.
    apiPassword:
      secretName: "studio-secrets"
      secretKey: "KEYCLOAK_API_PASSWORD"

  # -- Common pod scheduling configuration for all deployments.
  # These settings can be overridden by component-specific configurations.
  # Not possible to combine with component-specific configurations for each scheduling option.
  nodeSelector: {}
  # Example:
  # nodeSelector:
  #   kubernetes.io/os: linux
  #   node-role.kubernetes.io/worker: "true"

  # -- Pod affinity and anti-affinity rules for all deployments.
  # These settings can be overridden by component-specific configurations.
  affinity: {}
  # Example:
  # affinity:
  #   nodeAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       nodeSelectorTerms:
  #       - matchExpressions:
  #         - key: kubernetes.io/os
  #           operator: In
  #           values:
  #           - linux
  #   podAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #     - weight: 100
  #       podAffinityTerm:
  #         labelSelector:
  #           matchExpressions:
  #           - key: app
  #             operator: In
  #             values:
  #             - database
  #         topologyKey: kubernetes.io/hostname

  # -- Pod tolerations for all deployments.
  # These settings can be overridden by component-specific configurations.
  tolerations: []
  # Example:
  # tolerations:
  # - key: "key1"
  #   operator: "Equal"
  #   value: "value1"
  #   effect: "NoSchedule"
  # - key: "key2"
  #   operator: "Exists"
  #   effect: "NoExecute"

# Studio App component specific configuration
app:
  # -- app.replicaCount is the number of replicas for the Studio App deployment.
  # Increase this value for high availability and better load distribution.
  # Ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#replicas
  replicaCount: 1

  # -- app.image defines the container image settings for the app service.
  # This section defines the container image settings for the app service.
  # Ref: https://kubernetes.io/docs/concepts/containers/images/
  image:
    # -- app.image.name is the unified Studio container image (API + web client + optional co-located ingestion).
    # Chart 3.0.0 requires this image (Studio ≥ 2.0.0). Formerly studio-backend.
    name: "studio"
    # -- app.image.pullPolicy is the container image pull policy.
    # Valid values: Always, IfNotPresent, Never
    # Always: Always pull the image
    # IfNotPresent: Only pull if not present locally
    # Never: Never pull the image
    # Ref: https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
    pullPolicy: IfNotPresent

  # -- app.annotations defines annotations to add to all Studio App resources.
  # These annotations will be merged with deploymentAnnotations (deploymentAnnotations take precedence if keys conflict).
  # Example:
  #   custom.annotation/key: value
  # Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  annotations: {}

  # -- app.authSecret is the secret used by the app to sign sessions and tokens.
  # Must be at least 32 characters long. Stored in a Kubernetes secret. Required.
  authSecret:
    secretName: "studio-secrets"
    secretKey: "AUTH_SECRET"

  # -- app.env defines extra environment variables for the Studio App container,
  # in native Kubernetes EnvVar format (name + value or valueFrom).
  # NOTE: a user-supplied list REPLACES this default list wholesale (Helm does not
  # merge lists) — copy the default entries you want to keep.
  # NOTE: Do not set MS_API_URL here — the Studio API process does not read it.
  # Override the browser model-service URL via app.webClient.config.MS_API_URL.
  # Example:
  #   - name: MY_VAR
  #     value: "my-value"
  #   - name: MY_SECRET_VAR
  #     valueFrom:
  #       secretKeyRef:
  #         name: my-secret
  #         key: MY_SECRET_KEY
  env:
    # DELETE_CONVERSATIONS_OLDER_THAN_HOURS: conversation data retention period in
    # hours; conversations older than this are deleted by the cleanup cron job.
    # Unset (default) disables automatic conversation cleanup.
    # - name: DELETE_CONVERSATIONS_OLDER_THAN_HOURS
    #   value: "24"
    # DELETE_CONVERSATIONS_CRON_EXPRESSION: cron schedule for the conversation
    # cleanup job ("minute hour day-of-month month day-of-week").
    - name: DELETE_CONVERSATIONS_CRON_EXPRESSION
      value: "0 * * * *"

  # -- app.envFrom defines additional environment variables from ConfigMap or Secret.
  # These will be mounted as environment variables in the container.
  # Example:
  # - configMapRef:
  #     name: my-configmap
  # - secretRef:
  #     name: my-secret
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#configure-all-key-value-pairs-in-a-configmap-as-container-environment-variables
  envFrom: []

  # -- app.additionalContainers defines additional containers to run alongside the main Studio App container.
  # These containers will be part of the same pod and share the pod's network namespace.
  # Example:
  # - name: sidecar
  #   image: busybox
  #   command: ["sh", "-c", "while true; do echo 'Sidecar running'; sleep 30; done"]
  # Ref: https://kubernetes.io/docs/concepts/workloads/pods/#how-pods-manage-multiple-containers
  additionalContainers: []

  # -- app.serviceAccount defines the Kubernetes service account used by the app pod.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
  serviceAccount:
    # -- app.serviceAccount.create determines whether to create a new service account.
    create: false
    # -- app.serviceAccount.annotations defines annotations to add to the service account.
    # Useful for cloud provider specific configurations.
    annotations: {}
    # -- app.serviceAccount.name is the name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template.
    name: ""

  # -- app.podAnnotations defines annotations to add to the app pod.
  # Example:
  #   container.apparmor.security.beta.kubernetes.io/studio-app: runtime/default
  # Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}

  # -- app.podSecurityContext defines the security settings for the entire pod.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  podSecurityContext:
    # -- app.podSecurityContext.enabled determines whether to enable the pod security context.
    enabled: true
    # -- app.podSecurityContext.fsGroup is the group ID to run the container as.
    # fsGroup: 2000

  # -- app.securityContext defines the security settings for the app container.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  securityContext:
    # -- app.securityContext.enabled determines whether to enable the security context.
    enabled: true
    # -- app.securityContext.allowPrivilegeEscalation determines whether to allow privilege escalation.
    # Should be false for security best practices.
    allowPrivilegeEscalation: false
    # -- app.securityContext.runAsNonRoot determines whether to run the container as a non-root user.
    # Should be true for security best practices.
    runAsNonRoot: true
    # -- app.securityContext.capabilities defines the Linux capabilities configuration.
    # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-capabilities-for-a-container
    capabilities:
      # -- app.securityContext.capabilities.drop defines capabilities to drop from the container.
      # ALL drops all capabilities for maximum security.
      drop:
        - ALL
      # -- app.securityContext.capabilities.add defines capabilities to add to the container.
      # Uncomment and modify if specific capabilities are needed.
      # add: ['NET_BIND_SERVICE', 'NET_RAW']
    # -- app.securityContext.privileged determines whether to run the container in privileged mode.
    # Should be false for security best practices.
    # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
    # privileged: false
    # -- app.securityContext.readOnlyRootFilesystem determines whether to mount the root filesystem as read-only.
    # Can be enabled for additional security.
    # readOnlyRootFilesystem: true
    # -- app.securityContext.runAsUser is the user ID to run the container as.
    # runAsUser: 1000
    # -- app.securityContext.seccompProfile defines the seccomp profile configuration.
    # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-seccomp-profile-for-a-container
    # seccompProfile:
    #   type: RuntimeDefault

  # -- app.service defines how the app service is exposed within the cluster.
  # Ref: https://kubernetes.io/docs/concepts/services-networking/service/
  service:
    # -- app.service.type is the type of Kubernetes service.
    # Valid values: ClusterIP, NodePort, LoadBalancer, ExternalName
    # Ref: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    type: ClusterIP
    # -- app.service.port is the port number for the service.
    port: 80
    # -- app.service.targetPort is the target port in the container.
    # This should match the port your application listens on.
    targetPort: 4000

  # -- app.livenessProbe defines the liveness probe configuration.
  # This determines if the container is alive and functioning.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    # -- app.livenessProbe.enabled determines whether to enable the liveness probe.
    enabled: true
    # -- app.livenessProbe.httpGet defines the HTTP GET probe configuration.
    # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#define-a-liveness-command
    httpGet:
      # -- app.livenessProbe.httpGet.path is the path to check for liveness.
      path: /api/health
      # -- app.livenessProbe.httpGet.port is the port to check for liveness.
      port: 4000
      # -- app.livenessProbe.httpGet.scheme is the protocol to use for the check.
      scheme: HTTP
    # -- app.livenessProbe.initialDelaySeconds is the number of seconds to wait before starting probe.
    initialDelaySeconds: 15
    # -- app.livenessProbe.periodSeconds is how often to perform the probe.
    periodSeconds: 15
    # -- app.livenessProbe.successThreshold is the minimum consecutive successes for the probe to be considered successful.
    successThreshold: 1
    # -- app.livenessProbe.timeoutSeconds is the number of seconds after which the probe times out.
    timeoutSeconds: 5
    # -- app.livenessProbe.failureThreshold is the number of failures before the container is considered unhealthy.
    failureThreshold: 6

  # -- app.readinessProbe defines the readiness probe configuration.
  # This determines if the container is ready to receive traffic.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  readinessProbe:
    # -- app.readinessProbe.enabled determines whether to enable the readiness probe.
    enabled: true
    # -- app.readinessProbe.httpGet defines the HTTP GET probe configuration.
    # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#define-a-readiness-probe
    httpGet:
      # -- app.readinessProbe.httpGet.path is the path to check for readiness.
      path: /api/health
      # -- app.readinessProbe.httpGet.port is the port to check for readiness.
      port: 4000
      # -- app.readinessProbe.httpGet.scheme is the protocol to use for the check.
      scheme: HTTP
    # -- app.readinessProbe.initialDelaySeconds is the number of seconds to wait before starting probe.
    initialDelaySeconds: 15
    # -- app.readinessProbe.periodSeconds is how often to perform the probe.
    periodSeconds: 15
    # -- app.readinessProbe.successThreshold is the minimum consecutive successes for the probe to be considered successful.
    successThreshold: 1
    # -- app.readinessProbe.timeoutSeconds is the number of seconds after which the probe times out.
    timeoutSeconds: 5
    # -- app.readinessProbe.failureThreshold is the number of failures before the container is considered not ready.
    failureThreshold: 6

  # -- app.migration defines the database migration job configuration.
  # This section controls the database schema migration process.
  # Ref: https://kubernetes.io/docs/concepts/workloads/controllers/job/
  migration:
    # -- app.migration.enabled determines whether to enable the database migration job.
    # Set to false if you want to handle migrations manually.
    enabled: true
    # -- app.migration.image defines the image configuration for the migration job.
    image:
      # -- app.migration.image.name uses the same unified studio image with STUDIO_ROLE=migration.
      name: "studio"
      # -- app.migration.image.pullPolicy is the container image pull policy.
      pullPolicy: IfNotPresent

    # -- app.migration.waitForIt determines whether to wait for the database to be ready before running migrations.
    waitForIt: false
    # -- app.migration.waitForItContainer defines the configuration for the wait-for-it container.
    waitForItContainer:
      image: postgres:17.2

    # -- app.migration.annotations defines annotations to add to the migration job resource.
    # These annotations will be merged with deploymentAnnotations and helm hook annotations (helm hooks take precedence).
    # Example:
    #   custom.annotation/key: value
    # Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
    annotations: {}

    # -- app.migration.podAnnotations defines annotations to add to the migration job pod.
    # Example:
    #   custom.annotation/key: value
    # Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
    podAnnotations: {}

    # -- app.migration.env defines extra environment variables for the migration
    # job container, in native Kubernetes EnvVar format (name + value or valueFrom).
    # NOTE: a user-supplied list REPLACES this default list wholesale (Helm does
    # not merge lists) — copy the default entries you want to keep.
    env:
      # SKIP_KEYCLOAK: set "true" to skip Keycloak database creation. Required
      # when keycloak.enabled is false, or when you created the Keycloak database
      # manually. The chart no longer sets this automatically.
      - name: SKIP_KEYCLOAK
        value: "false"
      # KC_DEFAULT_DATABASE_CONNECTION_NAME: database the client connects to when
      # creating the Keycloak database (change if your server has no `postgres` db).
      - name: KC_DEFAULT_DATABASE_CONNECTION_NAME
        value: "postgres"

    # -- app.migration.nodeSelector defines which nodes the migration job can run on.
    # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
    nodeSelector: {}

    # -- app.migration.tolerations defines tolerations for the migration job.
    # This allows the job to run on nodes with matching taints.
    # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
    tolerations: []

    # -- app.migration.affinity defines affinity rules for the migration job.
    # This controls where the job can be scheduled.
    # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
    affinity: {}

    # -- app.migration.serviceAccount defines the Kubernetes service account used by the migration job pod.
    serviceAccount:
      # -- app.migration.serviceAccount.create determines whether to create a new service account.
      create: false
      # -- app.migration.serviceAccount.annotations defines annotations to add to the service account.
      annotations: {}
      # -- app.migration.serviceAccount.name is the name of the service account to use.
      # If not set and create is true, a name is generated using the fullname + "-db-migration" suffix.
      name: ""

  # -- app.ingress defines how the app service is exposed externally.
  # Ref: https://kubernetes.io/docs/concepts/services-networking/ingress/
  ingress:
    # -- app.ingress.enabled determines whether to create an ingress resource.
    enabled: true
    # -- app.ingress.className is the ingress class name.
    # This should match your cluster's ingress controller.
    # Ref: https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class
    className: ""
    # -- app.ingress.labels defines labels to add to the ingress resource.
    # Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
    labels: {}
    # -- app.ingress.additionalAnnotations defines additional annotations for the ingress resource.
    # Example:
    #   kubernetes.io/ingress.class: nginx
    #   cert-manager.io/cluster-issuer: letsencrypt-prod
    # Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
    additionalAnnotations: {}
    # -- app.ingress.tls defines the TLS configuration for the ingress.
    # Example:
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local
    tls: []

  # -- app.resources defines the resource limits and requests for Studio App.
  # This controls the compute resources allocated to the app container.
  # Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources: {}
    # Example configuration:
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # -- app.autoscaling defines the Horizontal Pod Autoscaling configuration.
  # This enables automatic scaling of the app deployment based on metrics.
  # Ref: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
  autoscaling:
    # -- app.autoscaling.enabled determines whether to enable horizontal pod autoscaling.
    enabled: false
    # -- app.autoscaling.minReplicas is the minimum number of replicas.
    minReplicas: 1
    # -- app.autoscaling.maxReplicas is the maximum number of replicas.
    maxReplicas: 100
    # -- app.autoscaling.targetCPUUtilizationPercentage is the target CPU utilization percentage.
    # The HPA will scale the deployment to maintain this CPU utilization.
    # Ref: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/#algorithm-details
    targetCPUUtilizationPercentage: 80
    # -- app.autoscaling.targetMemoryUtilizationPercentage is the target memory utilization percentage.
    # Uncomment to enable memory-based scaling.
    # targetMemoryUtilizationPercentage: 80

  # -- app.nodeSelector defines which nodes the app pods can run on.
  # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
  nodeSelector: {}

  # -- app.tolerations defines tolerations for the app pods.
  # This allows the pods to run on nodes with matching taints.
  # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  tolerations: []

  # -- app.affinity defines affinity rules for the app pods.
  # This controls where the pods can be scheduled.
  # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  affinity: {}

  # -- app.webClient holds browser runtime config for the unified app (no separate web-client Deployment).
  # config.js is mounted into the app pod at /usr/src/app/webclient/config.js.
  webClient:
    # -- app.webClient.environmentVariables feeds the web-client config.js ConfigMap mounted at
    # /usr/src/app/webclient/config.js on the app pod. Values are not secrets (ConfigMap only).
    # Used for feature flags (FEATURE_FLAG_*), MS_API_URL (window.MS_API_URL), CURRENT_VERSION_NUMBER, etc.
    # Breaking: nest under app.webClient (was top-level webClient). Web-client Deployment removed in chart 3.0.0.
    environmentVariables: {}

# Studio Event Ingestion component specific configuration
eventIngestion:
  # -- eventIngestion.mode controls event-ingestion topology.
  # colocated (default): ENABLE_EVENT_INGESTION=true on the app pod; no sibling Deployment.
  # separate: deploy {release}-app-ingestion with STUDIO_ROLE=ingestion; app sets ENABLE_EVENT_INGESTION=false.
  # disabled: neither co-located nor separate consumers.
  # Breaking: replaces eventIngestion.enabled. Do not set both semantics.
  #
  # Applicability:
  # - Both colocated and separate: Kafka-related keys under eventIngestion.environmentVariables
  #   (colocated injects them into the app Deployment; separate injects them into the ingestion Deployment).
  # - Only mode: separate: replicaCount, image, resources, serviceAccount, autoscaling/HPA,
  #   scheduling (nodeSelector / affinity / tolerations) for the sibling Deployment.
  # - volumes / volumeMounts / envFrom / additionalContainers: applied to the app pod when
  #   colocated, and to the sibling Deployment when separate.
  mode: colocated
  # -- eventIngestion.replicaCount is the number of replicas for the Event Ingestion deployment.
  # Applies only when eventIngestion.mode is separate.
  replicaCount: 1

  # -- eventIngestion.annotations defines annotations to add to all Studio Event Ingestion resources.
  # These annotations will be merged with deploymentAnnotations (deploymentAnnotations take precedence if keys conflict).
  # Example:
  #   custom.annotation/key: value
  # Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  annotations: {}

  # -- eventIngestion.image defines the container image settings for the event ingestion service.
  # Applies only when eventIngestion.mode is separate.
  image:
    # -- eventIngestion.image.name is the unified studio image for the separate ingestion Deployment.
    # Applies only when eventIngestion.mode is separate.
    name: "studio"
    # -- eventIngestion.image.pullPolicy is the container image pull policy.
    # Applies only when eventIngestion.mode is separate.
    pullPolicy: IfNotPresent

  # -- eventIngestion.env defines extra environment variables for the event
  # ingestion consumers, in native Kubernetes EnvVar format (name + value or
  # valueFrom). Injected into the app container when mode is colocated, and into
  # the sibling ingestion Deployment when mode is separate.
  # NOTE: a user-supplied list REPLACES this default list wholesale (Helm does not
  # merge lists) — copy the default entries you want to keep
  # (KAFKA_TOPIC, KAFKA_DLQ_TOPIC, KAFKA_GROUP_ID, KAFKA_SASL_PASSWORD).
  # Optional Kafka settings (add as needed):
  #   - name: KAFKA_BROKER_ADDRESS      # address of the Kafka broker (required for ingestion)
  #     value: "kafka.example.com:9092"
  #   - name: KAFKA_ENABLE_SSL          # enable SSL for Kafka connections
  #     value: "true"
  #   - name: KAFKA_CUSTOM_SSL          # use custom SSL certificates for Kafka
  #     value: "true"
  #   - name: KAFKA_CA_FILE             # path to the CA certificate file
  #     value: "/certs/ca.pem"
  #   - name: KAFKA_KEY_FILE            # path to the client key file
  #     value: "/certs/key.pem"
  #   - name: KAFKA_CERT_FILE           # path to the client certificate file
  #     value: "/certs/cert.pem"
  #   - name: KAFKA_REJECT_UNAUTHORIZED # verify server certificates
  #     value: "true"
  #   - name: NODE_TLS_REJECT_UNAUTHORIZED  # allow untrusted certificates ("0" allows)
  #     value: "0"
  #   - name: KAFKA_SASL_MECHANISM      # plain, SCRAM-SHA-256 or SCRAM-SHA-512
  #     value: "plain"
  #   - name: KAFKA_SASL_USERNAME
  #     value: "kafka-user"
  env:
    # KAFKA_TOPIC: Kafka topic for Rasa Pro assistant events.
    - name: KAFKA_TOPIC
      value: "rasa-events"
    # KAFKA_DLQ_TOPIC: Kafka topic for unprocessed events.
    - name: KAFKA_DLQ_TOPIC
      value: "rasa-events-dlq"
    # KAFKA_GROUP_ID: Kafka consumer group ID for Studio.
    - name: KAFKA_GROUP_ID
      value: "studio"
    # KAFKA_SASL_PASSWORD: SASL password for Kafka authentication.
    - name: KAFKA_SASL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: studio-secrets
          key: KAFKA_SASL_PASSWORD

  # -- eventIngestion.envFrom defines additional environment variables from ConfigMap or Secret.
  # Example:
  # - configMapRef:
  #     name: my-configmap
  # - secretRef:
  #     name: my-secret
  envFrom: []

  # -- eventIngestion.additionalContainers defines additional containers to run alongside the main Event Ingestion container.
  # Example:
  # - name: sidecar
  #   image: busybox
  #   command: ["sh", "-c", "while true; do echo 'Sidecar running'; sleep 30; done"]
  additionalContainers: []

  # -- eventIngestion.volumes defines additional volumes for the Event Ingestion container.
  # Example:
  # - name: config-volume
  #   configMap:
  #     name: special-config
  volumes: []

  # -- eventIngestion.volumeMounts defines where to mount the volumes in the Event Ingestion container.
  # Example:
  # - name: config-volume
  #   mountPath: /etc/config
  #   readOnly: true
  volumeMounts: []

  # -- eventIngestion.serviceAccount defines the Kubernetes service account used by the event ingestion pod.
  # Applies only when eventIngestion.mode is separate.
  serviceAccount:
    # -- eventIngestion.serviceAccount.create determines whether to create a new service account.
    # Applies only when eventIngestion.mode is separate.
    create: false
    # -- eventIngestion.serviceAccount.annotations defines annotations to add to the service account.
    # Applies only when eventIngestion.mode is separate.
    annotations: {}
    # -- eventIngestion.serviceAccount.name is the name of the service account to use.
    # Applies only when eventIngestion.mode is separate.
    name: ""

  # -- eventIngestion.podAnnotations defines annotations to add to the event ingestion pod.
  # Example:
  #   container.apparmor.security.beta.kubernetes.io/studio-app-ingestion: runtime/default
  podAnnotations: {}

  # -- eventIngestion.podSecurityContext defines the security settings for the entire pod.
  podSecurityContext:
    # -- eventIngestion.podSecurityContext.enabled determines whether to enable the pod security context.
    enabled: true
    # -- eventIngestion.podSecurityContext.fsGroup is the group ID to run the container as.
    # fsGroup: 2000

  # -- eventIngestion.securityContext defines the security settings for the event ingestion container.
  securityContext:
    # -- eventIngestion.securityContext.enabled determines whether to enable the security context.
    enabled: true
    # -- eventIngestion.securityContext.allowPrivilegeEscalation determines whether to allow privilege escalation.
    allowPrivilegeEscalation: false
    # -- eventIngestion.securityContext.runAsNonRoot determines whether to run the container as a non-root user.
    runAsNonRoot: true
    # -- eventIngestion.securityContext.capabilities defines the Linux capabilities configuration.
    capabilities:
      # -- eventIngestion.securityContext.capabilities.drop defines capabilities to drop from the container.
      drop:
        - ALL
      # -- eventIngestion.securityContext.capabilities.add defines capabilities to add to the container.
      # add: ['NET_BIND_SERVICE', 'NET_RAW']
    # -- eventIngestion.securityContext.privileged determines whether to run the container in privileged mode.
    # privileged: false
    # -- eventIngestion.securityContext.readOnlyRootFilesystem determines whether to mount the root filesystem as read-only.
    # readOnlyRootFilesystem: true
    # -- eventIngestion.securityContext.runAsUser is the user ID to run the container as.
    # runAsUser: 1000
    # -- eventIngestion.securityContext.seccompProfile defines the seccomp profile configuration.
    # seccompProfile:
    #   type: RuntimeDefault

  # -- eventIngestion.resources defines the resource limits and requests for the event ingestion service.
  # Applies only when eventIngestion.mode is separate.
  resources: {}
    # Example configuration:
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # -- eventIngestion.autoscaling defines the Horizontal Pod Autoscaling configuration.
  # Applies only when eventIngestion.mode is separate.
  autoscaling:
    # -- eventIngestion.autoscaling.enabled determines whether to enable horizontal pod autoscaling.
    # Applies only when eventIngestion.mode is separate.
    enabled: false
    # -- eventIngestion.autoscaling.minReplicas is the minimum number of replicas.
    # Applies only when eventIngestion.mode is separate.
    minReplicas: 1
    # -- eventIngestion.autoscaling.maxReplicas is the maximum number of replicas.
    # Applies only when eventIngestion.mode is separate.
    maxReplicas: 100
    # -- eventIngestion.autoscaling.targetCPUUtilizationPercentage is the target CPU utilization percentage.
    # Applies only when eventIngestion.mode is separate.
    targetCPUUtilizationPercentage: 80
    # -- eventIngestion.autoscaling.targetMemoryUtilizationPercentage is the target memory utilization percentage.
    # Applies only when eventIngestion.mode is separate.
    # targetMemoryUtilizationPercentage: 80

  # -- eventIngestion.nodeSelector defines which nodes the event ingestion pods can run on.
  # Applies only when eventIngestion.mode is separate.
  nodeSelector: {}

  # -- eventIngestion.tolerations defines tolerations for the event ingestion pods.
  # Applies only when eventIngestion.mode is separate.
  tolerations: []

  # -- eventIngestion.affinity defines affinity rules for the event ingestion pods.
  # Applies only when eventIngestion.mode is separate.
  affinity: {}

# Studio Keycloak component specific configuration
# Keycloak is retained to support migration of existing data to the new app's internal authentication.
keycloak:
  # -- keycloak.enabled determines whether to deploy the Keycloak authentication service.
  enabled: true
  # -- keycloak.replicaCount is the number of replicas for the Keycloak deployment.
  replicaCount: 1

  # -- keycloak.annotations defines annotations to add to all Studio Keycloak resources.
  # These annotations will be merged with deploymentAnnotations (deploymentAnnotations take precedence if keys conflict).
  # Example:
  #   custom.annotation/key: value
  # Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  annotations: {}

  # -- keycloak.image defines the container image settings for the Keycloak service.
  image:
    # -- keycloak.image.name is the name of the Keycloak container image.
    name: "studio-keycloak"
    # -- keycloak.image.pullPolicy is the container image pull policy.
    pullPolicy: IfNotPresent

  # -- The postgres database instance details for Keycloak to connect to.
  # This section configures the database connection parameters for Keycloak.
  # If not all fields are provided, the same values in the database section will be
  # used, including the keycloakDatabaseName for the database name.
  database: {}
  #   # -- The database host name or IP address where PostgreSQL is running.
  #   # Example: "postgres.example.com" or "10.0.0.1"
  #   host: ""
  #   # -- The database port number for PostgreSQL.
  #   # Default PostgreSQL port is 5432
  #   port: "5432"
  #   # -- The database name for Keycloak user management service.
  #   # This is used by Keycloak to store its user management data.
  #   # Note: This must be a plain string value (not a secret reference) as it's used in JDBC URL construction.
  #   databaseName: "keycloak"
  #   # -- The database username for Keycloak to connect with.
  #   # This user should have appropriate permissions on the database.
  #   # Can be specified as a plain string value or as a secret reference.
  #   # Plain value example: username: "keycloak"
  #   # Secret reference example:
  #   username:
  #    secretName: "studio-secrets"
  #    secretKey: "DB_USERNAME"
  #   username: ""
  #   # -- The database password configuration.
  #   # This references a Kubernetes secret containing the database password.
  #   password:
  #     secretName: "studio-secrets"
  #     secretKey: "KEYCLOAK_DATABASE_PASSWORD"

  # -- keycloak.env defines extra environment variables for the Keycloak
  # container, in native Kubernetes EnvVar format (name + value or valueFrom).
  # NOTE: a user-supplied list REPLACES this default list wholesale (Helm does
  # not merge lists) — copy the default entries you want to keep.
  env:
    # KC_HTTP_ENABLED: enable HTTP between proxy/load balancer and Keycloak.
    # Useful for secure internal networks where the reverse proxy terminates HTTPS.
    - name: KC_HTTP_ENABLED
      value: "true"
    # KC_PROXY_HEADERS: "xforwarded" parses X-Forwarded-* headers.
    # https://www.keycloak.org/server/reverseproxy
    - name: KC_PROXY_HEADERS
      value: "xforwarded"
    # KC_PROXY: legacy proxy setting, deprecated (replaced by KC_HTTP_ENABLED);
    # will be removed in a future release.
    - name: KC_PROXY
      value: "edge"

  # -- keycloak.envFrom defines additional environment variables from ConfigMap or Secret.
  # Example:
  # - configMapRef:
  #     name: my-configmap
  # - secretRef:
  #     name: my-secret
  envFrom: []

  # -- keycloak.additionalContainers defines additional containers to run alongside the main Keycloak container.
  # Example:
  # - name: sidecar
  #   image: busybox
  #   command: ["sh", "-c", "while true; do echo 'Sidecar running'; sleep 30; done"]
  additionalContainers: []

  # -- keycloak.serviceAccount defines the Kubernetes service account used by the Keycloak pod.
  serviceAccount:
    # -- keycloak.serviceAccount.create determines whether to create a new service account.
    create: false
    # -- keycloak.serviceAccount.annotations defines annotations to add to the service account.
    annotations: {}
    # -- keycloak.serviceAccount.name is the name of the service account to use.
    name: ""

  # -- keycloak.podAnnotations defines annotations to add to the Keycloak pod.
  # Example:
  #   container.apparmor.security.beta.kubernetes.io/studio-keycloak: runtime/default
  podAnnotations: {}

  # -- keycloak.podSecurityContext defines the security settings for the entire pod.
  podSecurityContext:
    # -- keycloak.podSecurityContext.enabled determines whether to enable the pod security context.
    enabled: true
    # -- keycloak.podSecurityContext.fsGroup is the group ID to run the container as.
    # fsGroup: 2000

  # -- keycloak.securityContext defines the security settings for the Keycloak container.
  securityContext:
    # -- keycloak.securityContext.enabled determines whether to enable the security context.
    enabled: true
    # -- keycloak.securityContext.allowPrivilegeEscalation determines whether to allow privilege escalation.
    allowPrivilegeEscalation: false
    # -- keycloak.securityContext.runAsNonRoot determines whether to run the container as a non-root user.
    runAsNonRoot: true
    # -- keycloak.securityContext.capabilities defines the Linux capabilities configuration.
    capabilities:
      # -- keycloak.securityContext.capabilities.drop defines capabilities to drop from the container.
      drop:
        - ALL
      # -- keycloak.securityContext.capabilities.add defines capabilities to add to the container.
      # add: ['NET_BIND_SERVICE', 'NET_RAW']
    # -- keycloak.securityContext.privileged determines whether to run the container in privileged mode.
    # privileged: false
    # -- keycloak.securityContext.readOnlyRootFilesystem determines whether to mount the root filesystem as read-only.
    # readOnlyRootFilesystem: true
    # -- keycloak.securityContext.runAsUser is the user ID to run the container as.
    # runAsUser: 1000
    # -- keycloak.securityContext.seccompProfile defines the seccomp profile configuration.
    # seccompProfile:
    #   type: RuntimeDefault

  # -- keycloak.service defines how the Keycloak service is exposed within the cluster.
  service:
    # -- keycloak.service.type is the type of Kubernetes service.
    type: ClusterIP
    # -- keycloak.service.port is the port number for the service.
    port: 80
    # -- keycloak.service.targetPort is the target port in the container.
    targetPort: 8080

  # -- keycloak.livenessProbe defines the liveness probe configuration.
  livenessProbe:
    # -- keycloak.livenessProbe.enabled determines whether to enable the liveness probe.
    enabled: true
    # -- keycloak.livenessProbe.httpGet defines the HTTP GET probe configuration.
    httpGet:
      # -- keycloak.livenessProbe.httpGet.path is the path to check for liveness.
      path: /auth
      # -- keycloak.livenessProbe.httpGet.port is the port to check for liveness.
      port: 8080
      # -- keycloak.livenessProbe.httpGet.scheme is the protocol to use for the check.
      scheme: HTTP
    # -- keycloak.livenessProbe.initialDelaySeconds is the number of seconds to wait before starting probe.
    initialDelaySeconds: 30
    # -- keycloak.livenessProbe.periodSeconds is how often to perform the probe.
    periodSeconds: 15
    # -- keycloak.livenessProbe.successThreshold is the minimum consecutive successes for the probe to be considered successful.
    successThreshold: 1
    # -- keycloak.livenessProbe.timeoutSeconds is the number of seconds after which the probe times out.
    timeoutSeconds: 5
    # -- keycloak.livenessProbe.failureThreshold is the number of failures before the container is considered unhealthy.
    failureThreshold: 6

  # -- keycloak.readinessProbe defines the readiness probe configuration.
  readinessProbe:
    # -- keycloak.readinessProbe.enabled determines whether to enable the readiness probe.
    enabled: true
    # -- keycloak.readinessProbe.httpGet defines the HTTP GET probe configuration.
    httpGet:
      # -- keycloak.readinessProbe.httpGet.path is the path to check for readiness.
      path: /auth
      # -- keycloak.readinessProbe.httpGet.port is the port to check for readiness.
      port: 8080
      # -- keycloak.readinessProbe.httpGet.scheme is the protocol to use for the check.
      scheme: HTTP
    # -- keycloak.readinessProbe.initialDelaySeconds is the number of seconds to wait before starting probe.
    initialDelaySeconds: 30
    # -- keycloak.readinessProbe.periodSeconds is how often to perform the probe.
    periodSeconds: 15
    # -- keycloak.readinessProbe.successThreshold is the minimum consecutive successes for the probe to be considered successful.
    successThreshold: 1
    # -- keycloak.readinessProbe.timeoutSeconds is the number of seconds after which the probe times out.
    timeoutSeconds: 5
    # -- keycloak.readinessProbe.failureThreshold is the number of failures before the container is considered not ready.
    failureThreshold: 6

  # -- keycloak.ingress defines how the Keycloak service is exposed externally.
  ingress:
    # -- keycloak.ingress.enabled determines whether to create an ingress resource.
    enabled: true
    # -- keycloak.ingress.className is the ingress class name.
    className: ""
    # -- keycloak.ingress.labels defines labels to add to the ingress resource.
    labels: {}
    # -- keycloak.ingress.additionalAnnotations defines additional annotations for the ingress resource.
    additionalAnnotations: {}
    # -- keycloak.ingress.tls defines the TLS configuration for the ingress.
    tls: []

  # -- keycloak.resources defines the resource limits and requests for the Keycloak service.
  resources: {}
    # Example configuration:
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 500m
    #   memory: 512Mi

  # -- keycloak.nodeSelector defines which nodes the Keycloak pods can run on.
  nodeSelector: {}

  # -- keycloak.tolerations defines tolerations for the Keycloak pods.
  tolerations: []

  # -- keycloak.affinity defines affinity rules for the Keycloak pods.
  affinity: {}

# Network policy settings
networkPolicy:
  # -- networkPolicy.enabled specifies whether to enable network policies
  enabled: false
  # -- networkPolicy.denyAll defines whether to apply denyAll network policy
  denyAll: false
  # -- networkPolicy.nodeCIDR allows for traffic from a given CIDR - it's required in order to make kubelet able to run live and readiness probes
  nodeCIDR: []
  #  - ipBlock:
  #      cidr: 0.0.0.0/0

global:
  # -- global.additionalDeploymentLabels can be used to map organizational structures onto system objects
  # https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  additionalDeploymentLabels: {}
  ingressHost:

# -- Controls whether the pod may use the node network namespace
hostNetwork: false

# -- dnsPolicy specifies Pod's DNS policy
## ref: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-s-dns-policy
dnsPolicy: ""

# -- dnsConfig specifies Pod's DNS config
## ref: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-dns-config
dnsConfig: {}
  # options:
  # - name: ndots
  #   value: "1"

# -- deploymentAnnotations defines annotations to add to all Studio resources.
# These annotations are applied globally to all resources (Deployments, Services, Ingresses, Jobs, HPAs, ConfigMaps, ServiceAccounts).
# Component-specific annotations can override these values if keys conflict.
# Example:
#   key: "value"
# Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
deploymentAnnotations: {}
  #  key: "value"

# -- deploymentLabels defines labels to add to all Studio deployment
deploymentLabels: {}

# -- podLabels defines labels to add to all Studio pod(s)
podLabels: {}

# Define the resources for the Rasa Pro model server
rasa:
  enabled: true
  fullnameOverride: rasapro

  rasa:
    replicaCount: 1
    image:
      repository: europe-west3-docker.pkg.dev/rasa-releases/rasa-pro/rasa-pro
      tag: "3.16.2-latest"

    strategy:
      type: Recreate

    settings:
      useDefaultArgs: false
      mountDefaultConfigmap: false
      mountModelsVolume: false

    command: ["python", "-m", "rasa.model_service"]

    overrideEnv:
      - name: "RASA_PRO_LICENSE"
        valueFrom:
          secretKeyRef:
            name: "studio-secrets"
            key: "RASA_PRO_LICENSE_SECRET_KEY"
      - name: OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: "studio-secrets"
            key: "OPENAI_API_KEY_SECRET_KEY"

    envFrom:
      - configMapRef:
          name: shared-environment

    service:
      port: 80
      targetPort: 8000

    livenessProbe:
      enabled: true
      httpGet:
        path: /modelservice/health
        port: 8000
        scheme: HTTP
      initialDelaySeconds: 30
      periodSeconds: 15
      successThreshold: 1
      timeoutSeconds: 5
      failureThreshold: 6

    readinessProbe:
      enabled: true
      httpGet:
        path: /modelservice/health
        port: 8000
        scheme: HTTP
      initialDelaySeconds: 30
      periodSeconds: 15
      successThreshold: 1
      timeoutSeconds: 5
      failureThreshold: 6

    ingress:
      enabled: true
      annotations: {}
      hosts:
        # -- Please update the below URL with the correct host name of the Studio deployment
        - host: *dns_hostname
          paths:
            - path: /modelservice
              pathType: Prefix

    persistence:
      create: true
      storageCapacity: 1Gi
      storageRequests: 1Gi
      # -- Make sure to set the correct storage class name based on your cluster configuration
      storageClassName:
      hostPath:
        enabled: false

    podSecurityContext:
      # -- User ID of the container to access the mounted volume
      fsGroup: 1001

    # -- rasa.resources specifies the resources limits and requests
    resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  rasaProServices:
    enabled: false
