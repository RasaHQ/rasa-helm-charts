{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.denyAll }}
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: {{ include "rasa.fullname" . }}-deny-all
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "rasa.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
{{- end }}
