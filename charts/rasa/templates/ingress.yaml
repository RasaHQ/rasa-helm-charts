{{- if and .Values.rasa.enabled .Values.rasa.ingress.enabled -}}
{{- /*
An ingress puts the Rasa Pro server in front of real traffic, so refuse to
render one for an API that authenticates nobody. Gated on ingress rather than
on settings.enableApi: enableApi says nothing about the running process once
settings.useDefaultArgs is false or rasa.command is overridden.
*/ -}}
{{- if and .Values.rasa.settings.enableApi
           (not .Values.rasa.settings.authToken)
           (not .Values.rasa.settings.jwtSecret)
           (not .Values.rasa.settings.allowUnauthenticatedApi) -}}
{{- fail "rasa.ingress.enabled exposes the Rasa HTTP API, but neither rasa.settings.authToken nor rasa.settings.jwtSecret is set, so the API would accept unauthenticated requests. Set one of them, or set rasa.settings.enableApi=false, or acknowledge the risk with rasa.settings.allowUnauthenticatedApi=true (for example when your ingress or service mesh already authenticates callers)." -}}
{{- end -}}
{{- $fullName := include "rasa.fullname" . -}}
{{- $svcPort := .Values.rasa.service.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "rasa.labels" . | nindent 4 }}
    {{- if .Values.rasa.ingress.labels }}
{{ toYaml .Values.rasa.ingress.labels | indent 4 }}
    {{- end }}
  {{- $annotations := merge (.Values.rasa.ingress.annotations | default dict | deepCopy) (.Values.global.ingressAnnotations | default dict) }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- $className := .Values.rasa.ingress.className | default .Values.global.ingressClassName }}
  {{- if $className }}
  ingressClassName: {{ $className }}
  {{- end }}
  {{- if .Values.rasa.ingress.tls }}
  tls:
    {{- range .Values.rasa.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.rasa.ingress.hosts }}
    - host: {{ $.Values.global.ingressHost | default .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if .pathType }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
          {{- if .extraPaths }}
          {{- range .extraPaths }}
          - path: {{ .path }}
            {{- if .pathType }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              service:
                name: {{ .serviceName }}
                port:
                  number: {{ .servicePort }}
          {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
