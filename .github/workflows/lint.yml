name: Lint

on:
  pull_request:
    types: [opened, synchronize, labeled, edited]

jobs:
  lint:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'automated') }}
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Fetch history
      run: git fetch --prune

    - name: Install Helm 3
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v3.22.0

    - name: Install Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11.2' 
  
    - name: Setup Helm chart testing
      uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

    - name: Run chart-testing (list-changed)
      id: list-changed
      run: |
        changed=$(ct list-changed --config ct.yaml)
        if [[ -n "$changed" ]]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        fi
        
    - name: Run chart-testing (lint)
      if: steps.list-changed.outputs.changed == 'true'
      run: ct lint --config ct.yaml

    # - name: Create kind cluster
    #   if: steps.list-changed.outputs.changed == 'true'
    #   uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0

    # - name: Run chart-testing (install)
    #   run: ct install --config ct.yaml

  lint-helm4:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'automated') }}
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Install Helm 4
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v4.3.0

    - name: Build dependencies
      run: |
        helm dependency build charts/studio
        helm dependency build charts/rasa
        helm dependency build charts/op-kits

    - name: Lint charts (strict)
      run: |
        helm lint --strict charts/studio
        helm lint --strict charts/rasa
        helm lint --strict charts/op-kits

  snyk:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'automated') }}
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        charts: ["studio", "rasa", "op-kits"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch history
        run: git fetch --prune

      - name: Install Helm 3
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      - name: Update dependencies
        run: helm dependency build ./charts/${{ matrix.charts }}

      - name: Generate Helm template
        run: helm template ./charts/${{ matrix.charts }} --output-dir ./output --kube-version 1.29.0

      - name: Scan chart with Snyk IAC
        uses: snyk/actions/iac@9adf32b1121593767fc3c057af55b55db032dc04 # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          file: ./output/
          args: --report --severity-threshold=high

      
