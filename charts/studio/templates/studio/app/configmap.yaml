apiVersion: v1
kind: ConfigMap
metadata:
  name: studio-web-client-configmap
data:
  windowVariables: |
    window.API_ENDPOINT = "{{ include "studio.authBaseUrl" . }}/api";
    {{- if not (hasKey (.Values.app.webClient.config | default dict) "MODEL_SERVICE_ENABLED") }}
    {{- $externalModelService := false }}
    {{- range (.Values.app.env | default list) }}
    {{- if and (eq .name "MS_API_URL") (or .value .valueFrom) }}
    {{- $externalModelService = true }}
    {{- end }}
    {{- end }}
    window.MODEL_SERVICE_ENABLED = {{ or .Values.rasa.enabled $externalModelService | toString | quote }};
    {{- end }}
    {{- if not (hasKey (.Values.app.webClient.config | default dict) "COPILOT_ENABLED") }}
    window.COPILOT_ENABLED = "false";
    {{- end }}
    {{- if not (hasKey (.Values.app.webClient.config | default dict) "FEATURE_FLAG_AI_TAGGING") }}
    window.FEATURE_FLAG_AI_TAGGING = {{ .Values.app.aiTagging.enabled | toString | quote }};
    {{- end }}
    {{- range $key, $value := .Values.app.webClient.config }}
    {{- if or (hasPrefix "FEATURE_FLAG_" $key) (has $key (list "MODEL_SERVICE_ENABLED" "COPILOT_ENABLED")) }}
    window.{{ $key }} = {{ $value | quote }};
    {{- end }}
    {{- end }}
    {{- with .Values.app.webClient.config.CURRENT_VERSION_NUMBER }}
    window.CURRENT_VERSION_NUMBER = {{ . | quote | trim }};
    {{- else }}
    window.CURRENT_VERSION_NUMBER = {{ .Values.tag | default .Chart.AppVersion | quote | trim }};
    {{- end }}
