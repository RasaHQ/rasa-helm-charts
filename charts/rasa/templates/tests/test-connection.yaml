apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "rasa.fullname" . }}-test-connection"
  labels:
    {{- include "rasa.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  automountServiceAccountToken: false
  containers:
    - name: wget
      image: busybox
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        # busybox has no baked-in non-root user; 65534 is nobody, which is all `wget` needs.
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      command: ['wget']
      # -O- streams the response to stdout. The default behaviour saves it to the
      # working directory, which is / in the busybox image and is not writable by
      # uid 65534, so the test would fail even against a healthy service.
      args: ['-O-', '{{ include "rasa.fullname" . }}:{{ .Values.rasa.service.port }}']
  restartPolicy: Never
