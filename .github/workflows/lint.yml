name: Lint

on:
  pull_request:
    types: [opened, synchronize, labeled, edited]

jobs:
  lint:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'automated') }}
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Fetch history
      run: git fetch --prune

    - name: Install Helm 3
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v3.22.0

    - name: Install Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14.7'
  
    - name: Setup Helm chart testing
      uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

    - name: Run chart-testing (list-changed)
      id: list-changed
      run: |
        changed=$(ct list-changed --config ct.yaml)
        if [[ -n "$changed" ]]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        fi
        
    - name: Run chart-testing (lint)
      if: steps.list-changed.outputs.changed == 'true'
      run: ct lint --config ct.yaml

    # - name: Create kind cluster
    #   if: steps.list-changed.outputs.changed == 'true'
    #   uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0

    # - name: Run chart-testing (install)
    #   run: ct install --config ct.yaml

  lint-helm4:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'automated') }}
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Install Helm 4
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v4.3.0

    - name: Build dependencies
      run: |
        helm dependency build charts/studio
        helm dependency build charts/rasa
        helm dependency build charts/op-kits

    - name: Lint charts (strict)
      run: |
        helm lint --strict charts/studio -f charts/studio/ci/lint-values.yaml
        helm lint --strict charts/rasa
        helm lint --strict charts/op-kits

  kube-linter:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'automated') }}
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        charts: ["studio", "rasa", "op-kits"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm 3
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      # Required: the render must include the vendored subchart, or the subchart's
      # objects are missing from the scan (studio drops 38 -> 27).
      - name: Update dependencies
        run: helm dependency build ./charts/${{ matrix.charts }}

      # kube-linter renders charts itself, but with default values only -- it takes
      # no values file. charts/studio has no default database host (the chart is not
      # installable without one), so a directory scan fails schema validation, finds
      # zero objects, and still exits 0. Rendering here instead means a render
      # failure fails this step outright, and each chart's optional
      # ci/lint-values.yaml supplies whatever its defaults cannot.
      - name: Render chart
        run: |
          chart="charts/${{ matrix.charts }}"
          if [ -f "$chart/ci/lint-values.yaml" ]; then
            helm template ${{ matrix.charts }} "$chart" -f "$chart/ci/lint-values.yaml" > rendered.yaml
          else
            helm template ${{ matrix.charts }} "$chart" > rendered.yaml
          fi
          test -s rendered.yaml

      - name: Scan chart with kube-linter
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1.0.7
        with:
          directory: rendered.yaml
          config: .kube-linter.yaml
          # renovate: datasource=github-releases depName=stackrox/kube-linter
          version: v0.8.3

      
