apiVersion: v1
kind: ConfigMap
metadata:
  name: studio-web-client-configmap
data:
  windowVariables: |
    {{- /* With no host configured anywhere, fall back to same-origin relative
           URLs instead of emitting malformed absolutes like "http:///api". */}}
    {{- if include "studio.appHost" . }}
    window.API_ENDPOINT = "{{ .Values.config.connectionType }}://{{ include "studio.appHost" . }}/api";
    {{- else }}
    window.API_ENDPOINT = "/api";
    {{- end }}
    {{- if hasKey (.Values.app.webClient.config | default dict) "MS_API_URL" }}
    window.MS_API_URL = {{ .Values.app.webClient.config.MS_API_URL | quote }};
    {{- else if and .Values.rasa.enabled (include "studio.modelServiceHost" .) }}
    window.MS_API_URL = "{{ include "studio.modelServiceBaseUrl" . }}";
    {{- else }}
    window.MS_API_URL = "";
    {{- end }}
    {{- range $key, $value := .Values.app.webClient.config }}
    {{- if hasPrefix "FEATURE_FLAG_" $key }}
    window.{{ $key }} = {{ $value | quote }};
    {{- end }}
    {{- end }}
    {{- with .Values.app.webClient.config.CURRENT_VERSION_NUMBER }}
    window.CURRENT_VERSION_NUMBER = {{ . | quote | trim }};
    {{- else }}
    window.CURRENT_VERSION_NUMBER = {{ .Values.tag | default .Chart.AppVersion | quote | trim }};
    {{- end }}
