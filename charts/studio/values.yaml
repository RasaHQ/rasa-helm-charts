# Default values for studio.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- (string) Override name of app.
nameOverride: ""
# -- (string) Override the full qualified app name.
fullnameOverride: ""

# -- Repository pull secrets.
imagePullSecrets: []
  # - name: regcred

# -- Image repository for Studio.
repository: "europe-west3-docker.pkg.dev/rasa-releases/studio/"
# -- Overrides the image tag for all Studio images (unified studio image;
# Studio ≥ 2.0.0). Empty (default) uses the chart's appVersion. Set an exact,
# immutable tag to pin deployments independently of chart upgrades.
tag: ""

# Global values are shared with the Rasa Pro subchart (Helm propagates
# `global.*` to every chart in the dependency tree).
global:
  # -- Single-host knob: set it once and the Studio
  # app ingress and Rasa Pro model-service ingress and every
  # derived URL (window.MS_API_URL, RASA_MODEL_SERVER_BASE_URL,
  # WEB_CLIENT_URL, CORS) resolve from it. WARNING: when set it silently
  # overrides per-component hosts, including rasa.ingress.hosts[0].host —
  # leave it UNSET for split-host installs and use the per-ingress hosts
  # (app.ingress.hostName, rasa.ingress.hosts[0].host) instead.
  ingressHost:
  # -- Ingress class for the Studio app ingress
  # and the Rasa Pro model-service ingress. Acts as a fallback: a per-ingress
  # className (app.ingress.className, rasa.ingress.className) wins when set.
  ingressClassName: ""
  # -- Annotations added to the Studio app ingress
  # and the Rasa Pro model-service ingress. Merged with per-ingress annotations
  # (app.ingress.extraAnnotations, rasa.ingress.annotations), which win
  # on key conflicts.
  # Example:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  ingressAnnotations: {}
  # -- Map organizational structures onto system objects.
  # https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  extraDeploymentLabels: {}

config:
  # -- Define the URL scheme (`http` or `https`) for externally derived URLs
  # (ingress-based API_URL, WEB_CLIENT_URL, web client API_ENDPOINT, model-service
  # public URLs, CORS_ORIGINS, etc.). Valid values: "http" or "https".
  # Does not change in-cluster http:// service-to-service calls.
  connectionType: "http"

  # -- The postgres database instance details for Studio to connect to.
  # This section configures the database connection parameters for Studio.
  database:
    # -- (string) The database host name or IP address where PostgreSQL is running.
    # No default: you must set this. An unset or empty value is rejected by the
    # schema at install time. Can be a plain string or a secret reference.
    # Plain value example: host: "postgres.example.com"
    # Secret reference example:
    # host:
    #   secretName: "my-secret"
    #   secretKey: "DB_HOST"
    host:
    # -- The database port number for PostgreSQL.
    # Default PostgreSQL port is 5432
    port: "5432"
    # -- The database username for Studio to connect with.
    # This user should have appropriate permissions on the database.
    # Can be specified as a plain string value or as a secret reference.
    # Plain value example: username: "studio"
    # Secret reference example:
    # username:
    #   secretName: "my-secret"
    #   secretKey: "DB_USERNAME"
    username: ""
    # -- The database password configuration.
    # This references a Kubernetes secret containing the database password.
    password:
      secretName: "studio-secrets"
      secretKey: "DATABASE_PASSWORD"
    # -- The database name for Studio app services.
    # This is used by Studio to store its data.
    # Can be specified as a plain string value or as a secret reference.
    # Plain value example: databaseName: "studio"
    # Secret reference example:
    # databaseName:
    #   secretName: "my-secret"
    #   secretKey: "DB_NAME"
    databaseName: "studio"
    # -- The database connection URL query parameters.
    # These parameters are used to configure the database connection.
    # Example: "sslmode=require&connect_timeout=30"
    queryParams: ""
    # -- Set to true if you want to use SSL for database connection.
    # When enabled, Studio will attempt to establish an encrypted connection to the database.
    preferSSL: "true"
    # -- If true, the server will reject database connections which are not present in the list of supplied CAs.
    # This provides additional security by ensuring only trusted certificates are accepted.
    rejectUnauthorized: ""
    # -- Set to true if you want to use AWS IAM authentication for the database.
    useAwsIamAuth: ""
    # -- The AWS region for the database. Needed if you want to use AWS IAM authentication for the database.
    awsRegion: ""
    # -- The IAM database username for the database. Needed if you want to use AWS IAM authentication for the database.
    iamDbUsername: ""


  # -- Common pod scheduling configuration for all deployments.
  # These settings can be overridden by component-specific configurations.
  # Not possible to combine with component-specific configurations for each scheduling option.
  nodeSelector: {}
  # Example:
  # nodeSelector:
  #   kubernetes.io/os: linux
  #   node-role.kubernetes.io/worker: "true"

  # -- Pod affinity and anti-affinity rules for all deployments.
  # These settings can be overridden by component-specific configurations.
  affinity: {}

  # -- Pod tolerations for all deployments.
  # These settings can be overridden by component-specific configurations.
  tolerations: []
  # Example:
  # tolerations:
  # - key: "key1"
  #   operator: "Equal"
  #   value: "value1"
  #   effect: "NoSchedule"
  # - key: "key2"
  #   operator: "Exists"
  #   effect: "NoExecute"

# Studio App component specific configuration
app:
  # -- Number of replicas for the Studio App deployment.
  # Increase this value for high availability and better load distribution.
  # Ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#replicas
  replicaCount: 1

  # -- Container image settings for the app service.
  # This section defines the container image settings for the app service.
  # Ref: https://kubernetes.io/docs/concepts/containers/images/
  image:
    # -- Unified Studio container image (API + web client + optional co-located ingestion).
    # Chart 3.0.0 requires this image (Studio ≥ 2.0.0). Formerly studio-backend.
    name: "studio"
    # -- Container image pull policy.
    # Valid values: Always, IfNotPresent, Never
    # Always: Always pull the image
    # IfNotPresent: Only pull if not present locally
    # Never: Never pull the image
    # Ref: https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
    pullPolicy: IfNotPresent

  # -- Annotations to add to all Studio App resources.
  # These annotations will be merged with deploymentAnnotations (deploymentAnnotations take precedence if keys conflict).
  # Example:
  #   custom.annotation/key: value
  # Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  annotations: {}

  # -- Secret used by the app to sign sessions and tokens.
  # Must be at least 32 characters long. Stored in a Kubernetes secret. Required.
  authSecret:
    secretName: "studio-secrets"
    secretKey: "AUTH_SECRET"

  # -- Initial admin user. A fresh install has no users and every later account is
  # invited by an admin, so the first one comes from here. Created by the backend
  # on startup, ignored once it exists.
  initialAdmin:
    # -- Email of the initial admin. The only value a fresh install needs.
    # Empty (default) skips creation — correct when an admin already exists.
    email: ""
    # -- Secret holding the bootstrap password. Read only when `email` is set.
    # The admin must choose a new password on first login.
    password:
      secretName: "studio-secrets"
      secretKey: "INITIAL_ADMIN_PASSWORD"

  # -- Optional GitHub App credentials, letting Studio connect projects to GitHub
  # repositories. Three secret references — `appId`, `installationId`, `privateKey`
  # — each a `secretName` + `secretKey` pair, so they may live in one Secret or
  # three. All three or none; a partial block is rejected by the schema.
  github: {}

  # -- Extra environment variables for the Studio App container,
  # in native Kubernetes EnvVar format (name + value or valueFrom).
  # NOTE: a user-supplied list REPLACES this default list wholesale (Helm does not
  # merge lists) — copy the default entries you want to keep.
  # NOTE: Do not set MS_API_URL here — the Studio API process does not read it.
  # Override the browser model-service URL via app.webClient.config.MS_API_URL.
  # Example:
  #   - name: MY_VAR
  #     value: "my-value"
  #   - name: MY_SECRET_VAR
  #     valueFrom:
  #       secretKeyRef:
  #         name: my-secret
  #         key: MY_SECRET_KEY
  env:
    # DELETE_CONVERSATIONS_OLDER_THAN_HOURS: conversation data retention period in
    # hours; conversations older than this are deleted by the cleanup cron job.
    # Unset (default) disables automatic conversation cleanup.
    # - name: DELETE_CONVERSATIONS_OLDER_THAN_HOURS
    #   value: "24"
    # DELETE_CONVERSATIONS_CRON_EXPRESSION: cron schedule for the conversation
    # cleanup job ("minute hour day-of-month month day-of-week").
    - name: DELETE_CONVERSATIONS_CRON_EXPRESSION
      value: "0 * * * *"
    # STUDIO_TELEMETRY_ENABLED: master switch for Segment product telemetry.
    # On by default; the published image includes the write key. Set to "false"
    # to opt out.
    - name: STUDIO_TELEMETRY_ENABLED
      value: "true"
    # STUDIO_USER_ID_TELEMETRY_ENABLED: when telemetry is enabled, controls whether
    # events attribute a real per-user id. Default "true". Set to "false" for
    # deployments that must disable per-user attribution (e.g. works-council /
    # banking requirements); events then use a shared constant identity instead.
    - name: STUDIO_USER_ID_TELEMETRY_ENABLED
      value: "true"

  # -- Additional environment variables from ConfigMap or Secret.
  # These will be mounted as environment variables in the container.
  # Example:
  # - configMapRef:
  #     name: my-configmap
  # - secretRef:
  #     name: my-secret
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#configure-all-key-value-pairs-in-a-configmap-as-container-environment-variables
  envFrom: []

  # -- Additional containers to run alongside the main Studio App container.
  # These containers will be part of the same pod and share the pod's network namespace.
  # Example:
  # - name: sidecar
  #   image: busybox
  #   command: ["sh", "-c", "while true; do echo 'Sidecar running'; sleep 30; done"]
  # Ref: https://kubernetes.io/docs/concepts/workloads/pods/#how-pods-manage-multiple-containers
  extraContainers: []

  # -- Kubernetes service account used by the app pod.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
  serviceAccount:
    # -- Whether to create a new service account.
    create: false
    # -- Annotations to add to the service account.
    # Useful for cloud provider specific configurations.
    annotations: {}
    # -- Name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template.
    name: ""

  # -- Whether the app pod is given a Kubernetes
  # API token at /var/run/secrets/kubernetes.io/serviceaccount. Studio never calls the
  # Kubernetes API, so the token is left out; set it to true if you add a sidecar that needs one.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
  automountServiceAccountToken: false

  # -- Annotations to add to the app pod.
  # Example:
  #   container.apparmor.security.beta.kubernetes.io/studio-app: runtime/default
  # Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}

  # -- Security settings for the entire pod.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  podSecurityContext:
    # -- Whether to enable the pod security context.
    enabled: true
    # -- Group ID to run the container as.
    # fsGroup: 2000

  # -- Security settings for the app container.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  securityContext:
    # -- Whether to enable the security context.
    enabled: true
    # -- Whether to allow privilege escalation.
    allowPrivilegeEscalation: false
    # -- Whether to run the container as a non-root user.
    runAsNonRoot: true
    # -- Linux capabilities configuration.
    # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-capabilities-for-a-container
    capabilities:
      # -- Capabilities to drop from the container.
      drop:
        - ALL
      # add: ['NET_BIND_SERVICE', 'NET_RAW']
    # privileged: false
    # readOnlyRootFilesystem: true
    # runAsUser: 1000
    # -- Seccomp profile configuration.
    # Kept active because the restricted Pod Security Standard requires a seccomp profile, and the
    # pod-level one above is commented out.
    # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-seccomp-profile-for-a-container
    seccompProfile:
      # -- Seccomp profile type.
      type: RuntimeDefault

  # -- How the app service is exposed within the cluster.
  # Ref: https://kubernetes.io/docs/concepts/services-networking/service/
  service:
    # -- Type of Kubernetes service.
    # Valid values: ClusterIP, NodePort, LoadBalancer, ExternalName
    # Ref: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    type: ClusterIP
    # -- Port number for the service.
    port: 80
    # -- Target port in the container.
    # This should match the port your application listens on.
    targetPort: 4000

  # -- Liveness probe configuration.
  # This determines if the container is alive and functioning.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    # -- Whether to enable the liveness probe.
    enabled: true
    # -- HTTP GET probe configuration.
    # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#define-a-liveness-command
    httpGet:
      # -- Path to check for liveness.
      path: /api/health
      # -- Port to check for liveness.
      port: 4000
      # -- Protocol to use for the check.
      scheme: HTTP
    # -- Number of seconds to wait before starting probe.
    initialDelaySeconds: 15
    # -- How often to perform the probe.
    periodSeconds: 15
    # -- Minimum consecutive successes for the probe to be considered successful.
    successThreshold: 1
    # -- Number of seconds after which the probe times out.
    timeoutSeconds: 5
    # -- Number of failures before the container is considered unhealthy.
    failureThreshold: 6

  # -- Readiness probe configuration.
  # This determines if the container is ready to receive traffic.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  readinessProbe:
    # -- Whether to enable the readiness probe.
    enabled: true
    # -- HTTP GET probe configuration.
    # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#define-a-readiness-probe
    httpGet:
      # -- Path to check for readiness.
      path: /api/health
      # -- Port to check for readiness.
      port: 4000
      # -- Protocol to use for the check.
      scheme: HTTP
    # -- Number of seconds to wait before starting probe.
    initialDelaySeconds: 15
    # -- How often to perform the probe.
    periodSeconds: 15
    # -- Minimum consecutive successes for the probe to be considered successful.
    successThreshold: 1
    # -- Number of seconds after which the probe times out.
    timeoutSeconds: 5
    # -- Number of failures before the container is considered not ready.
    failureThreshold: 6

  # -- Database migration job configuration.
  # This section controls the database schema migration process.
  # Ref: https://kubernetes.io/docs/concepts/workloads/controllers/job/
  migration:
    # -- Whether to enable the database migration job.
    # Set to false if you want to handle migrations manually.
    enabled: true
    # -- Number of retries before the migration
    # Job is marked failed.
    backoffLimit: 3
    # -- Hard wall-clock bound for the
    # migration Job; size it to your worst-case migration duration.
    activeDeadlineSeconds: 900
    # -- Image configuration for the migration job.
    image:
      # -- Uses the same unified studio image with STUDIO_ROLE=migration.
      name: "studio"
      # -- Container image pull policy.
      pullPolicy: IfNotPresent

    # -- Whether to wait for the database to be ready before running migrations.
    waitForIt: false
    # -- Configuration for the wait-for-it container.
    waitForItContainer:
      # -- Image used by the waitForIt init container.
      # Only `pg_isready` is invoked from it, so this version does not need to match the database server version.
      image: postgres:18.6
      # -- Security settings for the
      # waitForIt init container. Defaults satisfy the restricted Pod Security Standard.
      # NOTE: `runAsUser` is required because this image is configured to run as root; 999 is its
      # built-in `postgres` user. Adjust it if you point `image` at a different waitForIt image.
      # Ref: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
      securityContext:
        # -- Whether to enable the security context.
        enabled: true
        # -- Whether to allow privilege escalation.
        allowPrivilegeEscalation: false
        # -- Whether to run the container as a non-root user.
        runAsNonRoot: true
        # -- User ID to run the container as.
        runAsUser: 999
        # -- Linux capabilities configuration.
        capabilities:
          # -- Capabilities to drop from the container.
          drop:
            - ALL
        # -- Seccomp profile configuration.
        seccompProfile:
          # -- Seccomp profile type.
          type: RuntimeDefault

    # -- Security settings for the entire migration job pod.
    # The restricted Pod Security Standard is already satisfied by the container-level contexts, so the
    # pod-level equivalents are left commented out, matching the other Studio components.
    # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
    podSecurityContext:
      # -- Whether to enable the pod security context.
      enabled: true
      # -- Group ID to run the pod as.
      # fsGroup: 2000
      # -- Whether to run the pod as a non-root user.
      # NOTE: pod-level settings also apply to init containers, so enabling this requires a waitForIt
      # image that runs as non-root, or runAsUser set on that container.
      # runAsNonRoot: true
      # -- Seccomp profile configuration.
      # seccompProfile:
      #   type: RuntimeDefault

    # -- Security settings for the migration container.
    # The waitForIt init container has its own context under app.migration.waitForItContainer.securityContext.
    # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
    securityContext:
      # -- Whether to enable the security context.
      enabled: true
      # -- Whether to allow privilege escalation.
      allowPrivilegeEscalation: false
      # -- Whether to run the container as a non-root user.
      runAsNonRoot: true
      # -- Linux capabilities configuration.
      # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-capabilities-for-a-container
      capabilities:
        # -- Capabilities to drop from the container.
        drop:
          - ALL
        # add: ['NET_BIND_SERVICE', 'NET_RAW']
      # -- Seccomp profile configuration.
      # Kept active because the restricted Pod Security Standard requires a seccomp profile, and the
      # pod-level one above is commented out.
      # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-seccomp-profile-for-a-container
      seccompProfile:
        # -- Seccomp profile type.
        type: RuntimeDefault
      # privileged: false
      # readOnlyRootFilesystem: true
      # runAsUser: 1000

    # -- Annotations to add to the migration job resource.
    # These annotations will be merged with deploymentAnnotations and helm hook annotations (helm hooks take precedence).
    # Example:
    #   custom.annotation/key: value
    # Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
    annotations: {}

    # -- Annotations to add to the migration job pod.
    # Example:
    #   custom.annotation/key: value
    # Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
    podAnnotations: {}

    # -- Extra environment variables for the migration
    # job container, in native Kubernetes EnvVar format (name + value or valueFrom).
    # NOTE: a user-supplied list REPLACES this default list wholesale (Helm does
    # not merge lists) — copy the default entries you want to keep.
    env: []

    # -- Which nodes the migration job can run on.
    # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
    nodeSelector: {}

    # -- Tolerations for the migration job.
    # This allows the job to run on nodes with matching taints.
    # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
    tolerations: []

    # -- Affinity rules for the migration job.
    # This controls where the job can be scheduled.
    # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
    affinity: {}

    # -- Kubernetes service account used by the migration job pod.
    serviceAccount:
      # -- Whether to create a new service account.
      create: false
      # -- Annotations to add to the service account.
      annotations: {}
      # -- Name of the service account to use.
      # If not set and create is true, a name is generated using the fullname + "-db-migration" suffix.
      name: ""

    # -- Whether the migration Job pod is
    # given a Kubernetes API token. The migration only talks to PostgreSQL.
    automountServiceAccountToken: false

  # -- How the app service is exposed externally.
  # Ref: https://kubernetes.io/docs/concepts/services-networking/ingress/
  ingress:
    # -- Whether to create an ingress resource.
    enabled: true
    # -- Ingress class name.
    # This should match your cluster's ingress controller.
    # Ref: https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class
    className: ""
    # -- Labels to add to the ingress resource.
    # Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
    labels: {}
    # -- Additional annotations for the ingress resource.
    # Example:
    #   kubernetes.io/ingress.class: nginx
    #   cert-manager.io/cluster-issuer: letsencrypt-prod
    # Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
    extraAnnotations: {}
    # -- TLS configuration for the ingress.
    # Example:
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local
    tls: []

  # -- Resource limits and requests for Studio App.
  # This controls the compute resources allocated to the app container.
  # Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources: {}
    # Example configuration:
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # -- Horizontal Pod Autoscaling configuration.
  # This enables automatic scaling of the app deployment based on metrics.
  # Ref: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
  autoscaling:
    # -- Whether to enable horizontal pod autoscaling.
    enabled: false
    # -- Minimum number of replicas.
    minReplicas: 1
    # -- Maximum number of replicas.
    maxReplicas: 100
    # -- Target CPU utilization percentage.
    # The HPA will scale the deployment to maintain this CPU utilization.
    # Ref: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/#algorithm-details
    targetCPUUtilizationPercentage: 80
    # -- Target memory utilization percentage.
    # Uncomment to enable memory-based scaling.
    # targetMemoryUtilizationPercentage: 80

  # -- Which nodes the app pods can run on.
  # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
  nodeSelector: {}

  # -- Tolerations for the app pods.
  # This allows the pods to run on nodes with matching taints.
  # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  tolerations: []

  # -- Affinity rules for the app pods.
  # This controls where the pods can be scheduled.
  # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  affinity: {}

  # -- Browser runtime config for the unified app (no separate web-client Deployment).
  # config.js is mounted into the app pod at /usr/src/app/webclient/config.js.
  webClient:
    # -- Feeds browser window.* globals rendered into the
    # config.js ConfigMap mounted at /usr/src/app/webclient/config.js on the app
    # pod. Plain scalar map (KEY: "value") — these are NOT container environment
    # variables and cannot reference secrets (ConfigMap only).
    # Used for feature flags (FEATURE_FLAG_*), MS_API_URL (window.MS_API_URL),
    # CURRENT_VERSION_NUMBER, etc.
    config: {}

# Studio Event Ingestion component specific configuration
eventIngestion:
  # -- Event-ingestion topology.
  # colocated (default): ENABLE_EVENT_INGESTION=true on the app pod; no sibling Deployment.
  # separate: deploy {release}-app-ingestion with STUDIO_ROLE=ingestion; app sets ENABLE_EVENT_INGESTION=false.
  # disabled: neither co-located nor separate consumers.
  # Breaking: replaces eventIngestion.enabled. Do not set both semantics.
  #
  # Applicability:
  # - Both colocated and separate: Kafka-related keys under eventIngestion.env
  #   (colocated injects them into the app Deployment; separate injects them into the ingestion Deployment).
  # - Only mode: separate: replicaCount, image, resources, serviceAccount, autoscaling/HPA,
  #   scheduling (nodeSelector / affinity / tolerations) for the sibling Deployment.
  # - volumes / volumeMounts / envFrom / extraContainers: applied to the app pod when
  #   colocated, and to the sibling Deployment when separate.
  mode: colocated
  # -- Number of replicas for the Event Ingestion deployment.
  # Applies only when eventIngestion.mode is separate.
  replicaCount: 1

  # -- Annotations to add to all Studio Event Ingestion resources.
  # These annotations will be merged with deploymentAnnotations (deploymentAnnotations take precedence if keys conflict).
  # Example:
  #   custom.annotation/key: value
  # Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  annotations: {}

  # -- Container image settings for the event ingestion service.
  # Applies only when eventIngestion.mode is separate.
  image:
    # -- Unified studio image for the separate ingestion Deployment.
    # Applies only when eventIngestion.mode is separate.
    name: "studio"
    # -- Container image pull policy.
    # Applies only when eventIngestion.mode is separate.
    pullPolicy: IfNotPresent

  # -- Extra environment variables for the event
  # ingestion consumers, in native Kubernetes EnvVar format (name + value or
  # valueFrom). Injected into the app container when mode is colocated, and into
  # the sibling ingestion Deployment when mode is separate.
  # NOTE: a user-supplied list REPLACES this default list wholesale (Helm does not
  # merge lists) — copy the default entries you want to keep
  # (KAFKA_TOPIC, KAFKA_DLQ_TOPIC, KAFKA_GROUP_ID, KAFKA_SASL_PASSWORD).
  # Optional Kafka settings (add as needed):
  #   - name: KAFKA_BROKER_ADDRESS      # required for ingestion
  #     value: "kafka.example.com:9092"
  #   - name: KAFKA_ENABLE_SSL
  #     value: "true"
  #   - name: KAFKA_CUSTOM_SSL
  #     value: "true"
  #   - name: KAFKA_CA_FILE
  #     value: "/certs/ca.pem"
  #   - name: KAFKA_KEY_FILE
  #     value: "/certs/key.pem"
  #   - name: KAFKA_CERT_FILE
  #     value: "/certs/cert.pem"
  #   - name: KAFKA_REJECT_UNAUTHORIZED
  #     value: "true"
  #   - name: NODE_TLS_REJECT_UNAUTHORIZED  # allow untrusted certificates ("0" allows)
  #     value: "0"
  #   - name: KAFKA_SASL_MECHANISM      # plain, SCRAM-SHA-256 or SCRAM-SHA-512
  #     value: "plain"
  #   - name: KAFKA_SASL_USERNAME
  #     value: "kafka-user"
  env:
    # KAFKA_TOPIC: Kafka topic for Rasa Pro assistant events.
    - name: KAFKA_TOPIC
      value: "rasa-events"
    # KAFKA_DLQ_TOPIC: Kafka topic for unprocessed events.
    - name: KAFKA_DLQ_TOPIC
      value: "rasa-events-dlq"
    # KAFKA_GROUP_ID: Kafka consumer group ID for Studio.
    - name: KAFKA_GROUP_ID
      value: "studio"
    # KAFKA_SASL_PASSWORD: SASL password for Kafka authentication.
    - name: KAFKA_SASL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: studio-secrets
          key: KAFKA_SASL_PASSWORD

  # -- Additional environment variables from ConfigMap or Secret.
  # Example:
  # - configMapRef:
  #     name: my-configmap
  # - secretRef:
  #     name: my-secret
  envFrom: []

  # -- Additional containers to run alongside the main Event Ingestion container.
  # Example:
  # - name: sidecar
  #   image: busybox
  #   command: ["sh", "-c", "while true; do echo 'Sidecar running'; sleep 30; done"]
  extraContainers: []

  # -- Additional volumes for the Event Ingestion container.
  # Example:
  # - name: config-volume
  #   configMap:
  #     name: special-config
  volumes: []

  # -- Where to mount the volumes in the Event Ingestion container.
  # Example:
  # - name: config-volume
  #   mountPath: /etc/config
  #   readOnly: true
  volumeMounts: []

  # -- Kubernetes service account used by the event ingestion pod.
  # Applies only when eventIngestion.mode is separate.
  serviceAccount:
    # -- Whether to create a new service account.
    # Applies only when eventIngestion.mode is separate.
    create: false
    # -- Annotations to add to the service account.
    # Applies only when eventIngestion.mode is separate.
    annotations: {}
    # -- Name of the service account to use.
    # Applies only when eventIngestion.mode is separate.
    name: ""

  # -- Whether the event ingestion pod is
  # given a Kubernetes API token. Ingestion only talks to Kafka and PostgreSQL.
  # Applies only when eventIngestion.mode is separate.
  automountServiceAccountToken: false

  # -- Annotations to add to the event ingestion pod.
  # Example:
  #   container.apparmor.security.beta.kubernetes.io/studio-app-ingestion: runtime/default
  podAnnotations: {}

  # -- Security settings for the entire pod.
  podSecurityContext:
    # -- Whether to enable the pod security context.
    enabled: true
    # -- Group ID to run the container as.
    # fsGroup: 2000

  # -- Security settings for the event ingestion container.
  securityContext:
    # -- Whether to enable the security context.
    enabled: true
    # -- Whether to allow privilege escalation.
    allowPrivilegeEscalation: false
    # -- Whether to run the container as a non-root user.
    runAsNonRoot: true
    # -- Linux capabilities configuration.
    capabilities:
      # -- Capabilities to drop from the container.
      drop:
        - ALL
      # add: ['NET_BIND_SERVICE', 'NET_RAW']
    # privileged: false
    # readOnlyRootFilesystem: true
    # runAsUser: 1000
    # -- Seccomp profile configuration.
    # Kept active because the restricted Pod Security Standard requires a seccomp profile, and the
    # pod-level one above is commented out.
    # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-seccomp-profile-for-a-container
    seccompProfile:
      # -- Seccomp profile type.
      type: RuntimeDefault

  # -- Resource limits and requests for the event ingestion service.
  # Applies only when eventIngestion.mode is separate.
  resources: {}
    # Example configuration:
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # -- Horizontal Pod Autoscaling configuration.
  # Applies only when eventIngestion.mode is separate.
  autoscaling:
    # -- Whether to enable horizontal pod autoscaling.
    # Applies only when eventIngestion.mode is separate.
    enabled: false
    # -- Minimum number of replicas.
    # Applies only when eventIngestion.mode is separate.
    minReplicas: 1
    # -- Maximum number of replicas.
    # Applies only when eventIngestion.mode is separate.
    maxReplicas: 100
    # -- Target CPU utilization percentage.
    # Applies only when eventIngestion.mode is separate.
    targetCPUUtilizationPercentage: 80
    # -- Target memory utilization percentage.
    # Applies only when eventIngestion.mode is separate.
    # targetMemoryUtilizationPercentage: 80

  # -- Which nodes the event ingestion pods can run on.
  # Applies only when eventIngestion.mode is separate.
  nodeSelector: {}

  # -- Tolerations for the event ingestion pods.
  # Applies only when eventIngestion.mode is separate.
  tolerations: []

  # -- Affinity rules for the event ingestion pods.
  # Applies only when eventIngestion.mode is separate.
  affinity: {}

# Network policy settings
networkPolicy:
  # -- Whether to enable network policies. Only explicitly allowed traffic is permitted.
  enabled: false
  # -- Whether to default-deny all ingress and egress before more specific rules apply.
  denyAll: false
  # -- Node IP ranges allowed to reach pods. Required for kubelet probes when enabled.
  nodeCIDR: []
  #  - ipBlock:
  #      cidr: 0.0.0.0/0
  # -- Namespace running cluster DNS, matched on kubernetes.io/metadata.name.
  dnsNamespace: kube-system
  # -- Destination ports Studio may reach. Defaults cover HTTP and HTTPS only — add your database, Kafka and object-storage ports.
  egressPorts:
    - port: 443
      protocol: TCP
    - port: 80
      protocol: TCP
  # -- Peers allowed to reach the Studio app port. Required with denyAll; nodeCIDR only covers kubelet probes.
  allowIngressFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ingress-nginx

# -- Whether the pod may use the node network namespace.
hostNetwork: false

# -- Pod's DNS policy
## ref: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-s-dns-policy
dnsPolicy: ""

# -- Pod's DNS config
## ref: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-dns-config
dnsConfig: {}
  # options:
  # - name: ndots
  #   value: "1"

# -- Annotations to add to all Studio resources.
# These annotations are applied globally to all resources (Deployments, Services, Ingresses, Jobs, HPAs, ConfigMaps, ServiceAccounts).
# Component-specific annotations can override these values if keys conflict.
# Example:
#   key: "value"
# Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
deploymentAnnotations: {}
  #  key: "value"

# -- Labels to add to all Studio deployment.
deploymentLabels: {}

# -- Labels to add to all Studio pod(s)
podLabels: {}

# Define the resources for the Rasa Pro model server
rasa:
  # -- Deploy the Rasa Pro model server subchart.
  # To run Studio without the model service set this to false.
  # WARNING: never disable with `rasa: null` — deleting the key breaks the
  # subchart condition and re-enables the subchart with its default values
  # (the chart fails the render if it detects this).
  enabled: true
  fullnameOverride: rasapro

  replicaCount: 1
  image:
    repository: europe-west3-docker.pkg.dev/rasa-releases/rasa-pro/rasa-pro
    tag: "3.17.11-latest"

  strategy:
    type: Recreate

  command: ["python", "-m", "rasa.model_service"]

  overrideEnv:
    - name: "RASA_LICENSE"
      valueFrom:
        secretKeyRef:
          name: "studio-secrets"
          key: "RASA_PRO_LICENSE_SECRET_KEY"
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: "studio-secrets"
          key: "OPENAI_API_KEY_SECRET_KEY"

  envFrom:
    - configMapRef:
        name: shared-environment

  service:
    port: 80
    targetPort: 8000

  livenessProbe:
    enabled: true
    httpGet:
      path: /modelservice/health
      port: 8000
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 15
    successThreshold: 1
    timeoutSeconds: 5
    failureThreshold: 6

  readinessProbe:
    enabled: true
    httpGet:
      path: /modelservice/health
      port: 8000
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 15
    successThreshold: 1
    timeoutSeconds: 5
    failureThreshold: 6

  ingress:
    enabled: true
    annotations: {}
    hosts:
      # Empty host = the rasa ingress rule matches all hosts; set
      # global.ingressHost (preferred, single knob) or this host directly
      # to pin an exact host. The model-service URL derivation follows:
      # global.ingressHost > this host.
      - host: ""
        paths:
          - path: /modelservice
            pathType: Prefix

  persistence:
    create: true
    storageCapacity: 1Gi
    storageRequests: 1Gi
    # -- Make sure to set the correct storage class name based on your cluster configuration.
    storageClassName:
    hostPath:
      enabled: false

  podSecurityContext:
    # -- User ID of the container to access the mounted volume.
    fsGroup: 1001

  # -- Resources limits and requests.
  resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

  # -- `args: []` replaces the chart-generated arguments entirely, so the container
  # runs `command` alone. This is what settings.useDefaultArgs: false used to do.
  args: []
  # -- The model service ships its own models; no chart-managed volume.
  mountModelsVolume: false

  rasa:
    # -- The model service listens on 8000, not the chart default 5005.
    port: 8000
    # -- Studio supplies no endpoints or integrations, so render no ConfigMap.
    mountDefaultConfigmap: false
