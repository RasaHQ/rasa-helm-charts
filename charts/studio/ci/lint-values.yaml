# Minimum values for linting. charts/studio has no default database host — the
# chart cannot be installed without one, so the schema rejects an unset value.
# `helm lint`/`ct lint` render against defaults, so they need this file supplied.
config:
  database:
    host: "postgres.example.com"

# The rasa subchart requires an explicit storageClassName whenever
# persistence.create is true, and studio's own values set it true. There is no
# right default — the class is a property of the cluster, not the chart.
rasa:
  persistence:
    storageClassName: "standard"
