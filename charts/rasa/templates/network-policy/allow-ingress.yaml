{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.allowIngressFrom }}
{{- /*
denyAll blocks all Ingress, and the kubelet policy only admits nodeCIDR
sources. An ingress controller reaches pods from its own pod IP, so without a
rule naming it every request is dropped while the pod looks healthy.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rasa.fullname" . }}-allow-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "rasa.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    {{- toYaml .Values.networkPolicy.allowIngressFrom | nindent 4 }}
    ports:
    - protocol: TCP
      port: {{ .Values.rasa.port }}
{{- end }}
