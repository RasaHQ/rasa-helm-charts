{{- if .Values.rasa.mountDefaultConfigmap }}
{{- $credentials := include "rasa.hasCredentials" . }}
{{- $endpoints := include "rasa.hasEndpoints" . }}
{{- /*
Emit nothing when there is no configuration to ship. An empty ConfigMap is
never referenced by rasa.containers.volumes, so it would only add a dangling
object to every default install. The same two predicates drive the volume and
the mount, so the three cannot disagree.
*/ -}}
{{- if or $credentials $endpoints }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rasa.fullname" . }}-configmap
  labels:
    {{- include "rasa.labels" . | nindent 4 }}
data:
{{- if $credentials }}
  credentials: |
    {{- $credentials | nindent 4 }}
{{- end }}
{{- if $endpoints }}
  endpoints: |
    {{- $endpoints | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
