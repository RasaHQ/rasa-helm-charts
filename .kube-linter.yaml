# kube-linter configuration
#
# Replaces the previous Snyk IaC scan. kube-linter can read a chart directory
# and render it itself, but only with default values - it takes no values file.
# CI therefore renders each chart first (.github/scripts/render-all.sh) and
# points kube-linter at the output, because a directory scan of charts/studio
# fails schema validation, finds zero objects, and still exits 0. The render
# includes `helm dependency build`, which is required for charts with subcharts
# or the subchart's objects are silently skipped (studio drops 38 to 27).
#
# NOTE: this file is repo-root, and CI lints every chart from whichever branch
# is under test. Each release branch carries a different mix of chart versions,
# so an exclusion change that is correct for one branch can break another. Lint
# from the branch CI will actually run on before changing anything here.
#
# Every exclusion below is a deliberate design decision in these charts, not a
# finding waiting to be fixed. Everything else stays enabled, including
# privileged-container, privilege-escalation-container, host-network, host-pid,
# host-ipc, docker-sock, sensitive-host-mounts, cluster-admin-role-binding,
# access-to-secrets, ssh-port and the dangling-* family.
checks:
  exclude:
    # Charts ship `resources: {}` on purpose: sizing is the operator's decision
    # and depends entirely on their workload. Documented per component in values.yaml.
    - unset-cpu-requirements
    - unset-memory-requirements

    # readOnlyRootFilesystem is offered as a commented-out option in each
    # component's securityContext rather than enabled by default, because several
    # images write to their root filesystem at runtime.
    - no-read-only-root-fs

    # Probes target ports that are not declared as containerPort. This is
    # intentional - the ports are reachable, they are simply not enumerated in
    # the pod spec.
    - liveness-port
    - readiness-port

    # The database migration Job is a Helm hook with
    # `hook-delete-policy: before-hook-creation,hook-succeeded`, so Helm owns its
    # lifecycle. ttlSecondsAfterFinished would delete failed jobs that we keep
    # deliberately for debugging.
    - job-ttl-seconds-after-finished

    # Fires on the `busybox` image in templates/tests/test-connection.yaml, which
    # carries no tag. It does NOT fire on the `<version>-latest` image convention
    # (the check blocks `:latest` and untagged images only). Excluded for now;
    # pinning busybox in the test hooks would let this be re-enabled.
    - latest-tag
