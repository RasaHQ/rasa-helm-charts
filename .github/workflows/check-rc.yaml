name: Check if RC for Helm Charts

on:
  pull_request:
    paths:
      - 'charts/**'
      - '!.github/**'
      - '!_layouts/**'

jobs:
  detect-charts:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'automated') }}
    runs-on: ubuntu-26.04
    outputs:
      charts: ${{ steps.set-charts.outputs.charts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed charts
        id: set-charts
        shell: bash
        run: |
          # grep exits 1 when nothing matches; without '|| true' that aborts the step under
          # 'set -e -o pipefail' and the empty-list branch below is never reached.
          CHART_LIST=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^charts/[^/]+/' | cut -d'/' -f2 | sort -u || true)
          if [ -z "$CHART_LIST" ]; then
            echo "No chart directories changed"
            echo 'charts=[]' >> $GITHUB_OUTPUT
          else
            JSON_CHARTS="["
            FIRST=true
            while IFS= read -r chart; do
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                JSON_CHARTS="$JSON_CHARTS,"
              fi
              JSON_CHARTS="$JSON_CHARTS\"$chart\""
            done <<< "$CHART_LIST"
            JSON_CHARTS="$JSON_CHARTS]"
            echo "Changed charts: $JSON_CHARTS"
            echo "charts=$JSON_CHARTS" >> $GITHUB_OUTPUT
          fi

  check-rc:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'automated') && needs.detect-charts.outputs.charts != '[]' }}
    needs: detect-charts
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        chart: ${{ fromJson(needs.detect-charts.outputs.charts) }}
      fail-fast: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if release candidate
        uses: ./.github/actions/check-chart-rc
        with:
          chart-path: charts/${{ matrix.chart }}
          fail-if-rc: 'true'
