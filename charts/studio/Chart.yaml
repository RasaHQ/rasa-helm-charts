apiVersion: v2
name: studio
description: A Rasa Studio Helm chart for Kubernetes
type: application
# Minimum Kubernetes version. Matches the floor the bundled rasa subchart
# declares, which its PodDisruptionBudget's unhealthyPodEvictionPolicy sets at
# 1.31. Helm applies kubeVersion only to the chart a user installs directly and
# NOT to a vendored subchart, so rasa's own floor is unenforceable from here --
# this chart has to declare it or the constraint is bypassed. autoscaling/v2 in
# templates/studio/app/hpa.yaml only needs 1.23. The `-0` suffix lets
# pre-release cluster versions satisfy the constraint.
kubeVersion: ">=1.31.0-0"
version: 3.0.0-rc.61
appVersion: "2.0.0-latest"
home: https://helm.rasa.com
sources:
  - https://github.com/RasaHQ/rasa-helm-charts/tree/main/charts/studio
keywords:
  - Kubernetes
  - Studio
  - CALM
maintainers:
  - name: Rasa Infrastructure and Security Team
    url: https://github.com/RasaHQ/rasa-helm-charts
    email: support@rasa.com
dependencies:
  - name: rasa
    condition: rasa.enabled
    repository: oci://europe-west3-docker.pkg.dev/rasa-releases/helm-charts
    version: 3.0.0-rc.22
