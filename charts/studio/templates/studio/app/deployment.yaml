{{- include "studio.eventIngestion.validate" . -}}
{{- $mode := include "studio.eventIngestion.mode" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "studio.fullname" . }}-app
  labels:
    {{- include "studio.labels" . | nindent 4 -}}
    app.kubernetes.io/component: studio-app
    {{- if .Values.deploymentLabels }}
      {{- toYaml .Values.deploymentLabels | nindent 4 }}
    {{- end }}
  {{- include "app.deployment.annotations" . | nindent 2 }}
spec:
  {{- if not .Values.app.autoscaling.enabled }}
  replicas: {{ .Values.app.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "studio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: studio-app
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/studio/app/configmap.yaml") . | sha256sum }}
        {{- with .Values.app.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "studio.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: studio-app
        {{- if .Values.podLabels }}
          {{ toYaml .Values.podLabels | nindent 8 }}
        {{- end }}
    spec:
      hostNetwork: {{ .Values.hostNetwork }}
      dnsPolicy: {{ include "studio.dnsPolicy" . }}
      {{- if .Values.dnsConfig }}
      dnsConfig:
        {{ toYaml .Values.dnsConfig | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "studio.app.serviceAccountName" . }}
      {{- if .Values.app.podSecurityContext.enabled }}
      securityContext:
        {{- omit .Values.app.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-app
          {{- if .Values.app.securityContext.enabled }}
          securityContext:
            {{- omit .Values.app.securityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          image: {{ include "studio.app.image" . }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.service.targetPort }}
              protocol: TCP
          {{- if or .Values.app.livenessProbe.enabled }}
          livenessProbe:
            {{- omit .Values.app.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if or .Values.app.readinessProbe.enabled }}
          readinessProbe:
            {{- omit .Values.app.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          env:
            {{- include "studio.app.env" . | nindent 12 }}
            - name: WEB_CLIENT_URL
              value: "{{ .Values.config.connectionType }}://{{ include "studio.appHost" . }}"
            - name: API_URL
              value: "{{ .Values.config.connectionType }}://{{ include "studio.appHost" . }}/api"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.authSecret.secretName | quote }}
                  key: {{ .Values.app.authSecret.secretKey | quote }}
            - name: BETTER_AUTH_BASE_URL
              value: "{{ .Values.config.connectionType }}://{{ include "studio.appHost" . }}"
            - name: STUDIO_ROLE
              value: "app"
            - name: ENABLE_EVENT_INGESTION
              value: {{ if eq $mode "colocated" }}"true"{{ else }}"false"{{ end }}
            {{- if eq $mode "colocated" }}
            - name: KAFKA_CLIENT_ID
              {{- if .Values.eventIngestion.kafkaClientId }}
              value: {{ .Values.eventIngestion.kafkaClientId | quote }}
              {{- else }}
              value: "kafka-python-rasa"
              {{- end }}
            {{- range $key, $value := .Values.eventIngestion.environmentVariables }}
            - name: {{ $key | upper }}
              {{- if $value.value }}
              value: {{ $value.value | quote }}
              {{- else if $value.secret }}
              valueFrom:
                secretKeyRef:
                  name: {{ $value.secret.name }}
                  key: {{ $value.secret.key }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- range $key, $value := .Values.app.environmentVariables }}
            - name: {{ $key | upper }}
              {{- if $value.value }}
              value: {{ $value.value | quote }}
              {{- else if $value.secret }}
              valueFrom:
                secretKeyRef:
                  name: {{ $value.secret.name }}
                  key: {{ $value.secret.key }}
              {{- end }}
            {{- end }}
          volumeMounts:
            - name: web-client-config
              mountPath: /usr/src/app/webclient/config.js
              subPath: config.js
              readOnly: true
          {{- if eq $mode "colocated" }}
            {{- with .Values.eventIngestion.volumeMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- $envFrom := .Values.app.envFrom | default (list) }}
          {{- if eq $mode "colocated" }}
            {{- $envFrom = concat $envFrom (.Values.eventIngestion.envFrom | default (list)) }}
          {{- end }}
          {{- if $envFrom }}
          envFrom:
            {{- toYaml $envFrom | nindent 12 }}
          {{- end }}
      {{- if .Values.app.additionalContainers }}
        {{- toYaml .Values.app.additionalContainers | nindent 8 }}
      {{- end }}
      {{- include "studio.app.scheduling" . | nindent 6 }}
      volumes:
        - name: web-client-config
          configMap:
            name: studio-web-client-configmap
            items:
              - key: windowVariables
                path: config.js
      {{- if eq $mode "colocated" }}
        {{- with .Values.eventIngestion.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
