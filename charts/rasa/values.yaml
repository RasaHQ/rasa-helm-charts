# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Overrides the chart name used in resource names.
nameOverride: ""
# -- Overrides the full name prefix for all chart resources.
fullnameOverride: ""

# -- Secrets for pulling images from private registries.
imagePullSecrets: []
  # - name: regcred

rasa:
  # -- Secret holding the Rasa Pro licence. Required. Passed to the container as RASA_LICENSE.
  license:
    secretName: "rasa-secrets"
    secretKey: "RASA_LICENSE"
  # -- Run Rasa with --debug.
  debugMode: false
  # -- Port Rasa binds. The container port, Service targetPort and probes all follow it.
  port: 5005
  # -- Serve the Rasa HTTP API. On by default because rasa run exits when it has neither a model nor the API. The API is unauthenticated until you set authToken or jwtSecret.
  enableApi: true
  # -- Secret holding the static bearer token for API requests. Unset by default.
  authToken:
    # secretName: "rasa-secrets"
    # secretKey: "AUTH_TOKEN"
  # -- Secret holding the JWT signing secret for API requests. Unset by default; pair with jwtMethod.
  jwtSecret:
    # secretName: "rasa-secrets"
    # secretKey: "JWT_SECRET"
  # -- Accept an unauthenticated API: silences the install warning and the render refusal.
  allowUnauthenticatedApi: false
  # -- JWT algorithm.
  jwtMethod: HS256
  # -- Allowed CORS origin. Restrict to specific domains in production.
  cors: '*'
  # -- Render integrations and endpoints into a ConfigMap mounted at /app/integrations.yml and /app/endpoints.yml. Set false to supply them yourself.
  mountDefaultConfigmap: true
  ## See: https://mantle.rasa.com/reference/integrations-yml
  # -- Rendered to /app/integrations.yml (Mantle: LLM, model groups, channels, MCP servers, tracing). Replaces the file in your trained project, so supply all of it.
  integrations: {}
    # llm:
    #   model_group: orchestrator
    # model_groups:
    #   - id: orchestrator
    #     models:
    #       - provider: openai
    #         model: gpt-5.1
    #         api_key_env: OPENAI_API_KEY
    # channels:
    #   rest: { enabled: true }

  # -- Raw integrations.yml as a string, deep-merged with integrations, which wins. For --set-file or ArgoCD fileParameters.
  integrationsRaw: ""

  # See: https://rasa.com/docs/rasa/telemetry/telemetry/
  # -- Telemetry settings.
  telemetry:
    # -- Send anonymous usage data to Rasa.
    enabled: true
    # -- Print telemetry payloads to stdout.
    debug: false

  # Not all parameters are mandatory
  ## See: https://rasa.com/docs/pro/build/configuring-assistant#endpoints
  # -- DEPRECATED. Rendered to /app/endpoints.yml: tracker store, event broker, lock store, action endpoint, NLG server.
  endpoints: {}
    # action_endpoint:
    #   url: "http://my-action-server.actions.svc.cluster.local:5055/webhook"
    #   # or run actions in-process instead of over HTTP:
    #   # actions_module: "actions"

    # tracker_store:              # conversations are in memory unless set
    #   type: redis
    #   url: redis.data.svc.cluster.local
    #   port: 6379
    #   db: 0
    #   password: <password>
    #   use_ssl: false

    # event_broker:               # stream conversation events out
    #   type: kafka
    #   url: kafka.data.svc.cluster.local:9092
    #   security_protocol: SASL_PLAINTEXT
    #   sasl_mechanism: SCRAM-SHA-512
    #   sasl_username: rasa
    #   sasl_password: <password>

    # lock_store:                 # required for more than one replica
    #   type: redis
    #   url: redis.data.svc.cluster.local

    # model_groups:               # moves to rasa.integrations under Mantle
    #   - id: openai-gpt-4o
    #     models:
    #       - provider: openai
    #         model: gpt-4o-2024-11-20

  # -- DEPRECATED. Raw endpoints.yml as a string, deep-merged with endpoints, which wins. Malformed YAML fails the render.
  endpointsRaw: ""

  # -- Rasa runtime environment. 'production' disables development-only defaults.
  environment: development
  # logging sets log levels for Rasa and external libraries
  # See: https://rasa.com/docs/rasa/next/command-line-interface/#log-level
  # -- Logging settings.
  logging:
    # -- Rasa log level.
    logLevel: info


# ---- Deployment / Kubernetes workload ----

# -- Number of Rasa Pro replicas.
replicaCount: 1
# Rasa Pro image.
image:
  # -- Image repository.
  repository: "europe-west3-docker.pkg.dev/rasa-releases/rasa-pro/rasa-pro"
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image tag. Empty uses the chart appVersion. Set an exact tag to pin independently of chart upgrades.
  tag: ""

## ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
# -- Deployment strategy.
strategy: {}
#   type: RollingUpdate
#   rollingUpdate:
#     maxSurge: 1
#     maxUnavailable: 0

# -- Mount an emptyDir for models at /app/models.
mountModelsVolume: true
# -- Replaces the generated container arguments. Unset builds them from rasa.port, rasa.cors, rasa.enableApi, rasa.debugMode. [] means no arguments.
args:
# -- Arguments appended to the generated ones. Ignored when args is set.
extraArgs: []
# -- Overrides the container entrypoint.
command: []
# -- Replaces the generated environment wholesale, including RASA_LICENSE. Empty keeps it. Use extraEnv to add.
overrideEnv: []
# -- Environment variables added to the generated ones.
extraEnv: []
  # - name: SOME_CUSTOM_ENV_VAR
  #   value: "custom value"
  # - name: SOME_CUSTOM_ENV_VAR_FROM_SECRET
  #   valueFrom:
  #     secretKeyRef:
  #       name:
  #       key:

# -- Environment from ConfigMaps or Secrets.
envFrom: []
  # - configMapRef:
  #     name: my-configmap

## Ref: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
## <PATH_TO_INITIAL_MODEL> has to be a URL (without auth) that points to a tar.gz file
# -- Init containers.
initContainers: []
  # - name: initial-model
  #   image: "alpine"
  #   command: ["/bin/sh", "-c"]
  #   args:
  #     - cd /app/models/ && wget <PATH_TO_INITIAL_MODEL> -O model.tar.gz
  #   volumeMounts:
  #     - mountPath: /app/models
  #       name: models

# -- Sidecar containers.
extraContainers: []
  # - name: extra
  #   image: "busybox"
  #   command: ["bash", "-c"]

## Ref: https://kubernetes.io/docs/concepts/storage/volumes/
# -- Additional volumes.
extraVolumes: []
#   - hostPath:
#       path: <HOST_PATH>
#     name: <VOLUME_NAME>

# -- Additional volume mounts.
extraVolumeMounts: []
  # - name: <VOLUME_NAME>
  #   mountPath: <CONTAINER_PATH>
  #   readOnly: true

# -- Service account for the Rasa pod.
serviceAccount:
  # -- Create the service account.
  create: true
  # -- Service account annotations.
  annotations: {}
  # -- Service account name. Empty generates one.
  name: ""

# -- (int) Grace period after SIGTERM before SIGKILL. Unset uses the Kubernetes default of 30.
terminationGracePeriodSeconds:

# -- Pod annotations.
podAnnotations: {}
  # container.apparmor.security.beta.kubernetes.io/rasa: runtime/default

# -- Pod-level security context.
podSecurityContext:
  enabled: true
  # fsGroup: 2000

# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
# -- Mount a Kubernetes API token. Off: Rasa never calls the API and the chart grants no RBAC. Turn on for a sidecar that needs one.
automountServiceAccountToken: false

# Ref: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
# -- Container security context. Defaults satisfy the restricted Pod Security Standard.
containerSecurityContext:
  enabled: true
  # -- Allow privilege escalation.
  allowPrivilegeEscalation: false
  # readOnlyRootFilesystem: true
  # -- Linux capabilities.
  capabilities:
    # -- Capabilities to drop.
    drop:
      - ALL
  # -- Run as a non-root user. Requires an image whose USER is a numeric non-root uid; the stock image is 1001.
  runAsNonRoot: true
  # -- Seccomp profile.
  seccompProfile:
    # -- Seccomp profile type.
    type: RuntimeDefault

# -- Service exposing the Rasa Pro server.
service:
  # -- Service type.
  type: ClusterIP
  # -- Service port.
  port: 5005
  # -- Container port traffic is forwarded to. Empty follows port.
  targetPort:
  # -- Service annotations.
  annotations: {}
  ## Ref: https://kubernetes.io/docs/concepts/services-networking/service/#nodeport
  nodePort:
  ## Ref: https://kubernetes.io/docs/concepts/services-networking/service/#loadbalancer
  loadBalancerIP:
  ## Ref: http://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip
  externalTrafficPolicy: Cluster

# rasa.livenessProbe is used to override default liveness probe settings
# -- Liveness probe.
livenessProbe:
  # -- Enable the liveness probe.
  enabled: true
  # -- Liveness probe HTTP request.
  httpGet:
    path: /
    # -- Probed container port. Empty follows port.
    port:
    scheme: HTTP
  # -- Delay before the first liveness probe.
  initialDelaySeconds: 15
  # -- Liveness probe interval, seconds.
  periodSeconds: 15
  # -- Consecutive successes needed after a failure.
  successThreshold: 1
  # -- Liveness probe timeout, seconds.
  timeoutSeconds: 5
  # -- Failures before the container is restarted.
  failureThreshold: 6
  # -- Grace period after a liveness probe failure.
  terminationGracePeriodSeconds: 30

# rasa.readinessProbe is used to override default readiness probe settings
# -- Readiness probe.
readinessProbe:
  # -- Enable the readiness probe.
  enabled: true
  # -- Readiness probe HTTP request.
  httpGet:
    path: /
    # -- Probed container port. Empty follows port.
    port:
    scheme: HTTP
  # -- Delay before the first readiness probe.
  initialDelaySeconds: 15
  # -- Readiness probe interval, seconds.
  periodSeconds: 15
  # -- Consecutive successes needed after a failure.
  successThreshold: 1
  # -- Readiness probe timeout, seconds.
  timeoutSeconds: 5
  # -- Failures before the pod is marked unready.
  failureThreshold: 6

## Ref: https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/
# -- Container lifecycle hooks (postStart / preStop).
lifecycle: {}
  # preStop:
  #   exec:
  #     command: ["/bin/sh", "-c", "sleep 10"]
  # postStart:
  #   exec:
  #     command: ["/bin/sh", "-c", "echo started"]

# Configure the ingress resource that allows you to access the deployment installation.
## ref: http://kubernetes.io/docs/user-guide/ingress/
# -- Ingress for the Rasa Pro server.
ingress:
  # -- Create an Ingress.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Ingress labels.
  labels: {}
  # -- Ingress annotations.
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Hosts and paths. Empty by default, so an ingress you enable is one you fully describe. global.ingressHost overrides each host but cannot create one.
  hosts: []
    # - host: rasa.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
    #   extraPaths: []
  # -- TLS configuration. Keep the hosts in sync with ingress.hosts; not derived from global.ingressHost.
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Resource requests and limits.
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# rasa.autoscaling specifies the HPA settings
# -- HorizontalPodAutoscaler.
autoscaling:
  # -- Enable the HorizontalPodAutoscaler.
  enabled: false
  # -- Minimum replicas.
  minReplicas: 1
  # -- Maximum replicas.
  maxReplicas: 100
  # -- Target CPU utilisation percentage.
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# rasa.persistence creates a PVC for model storage. Only supported when running Rasa Pro as a model service for Studio.
# Note: the PVC name is scoped to the namespace, so only one release per namespace can use persistence at a time.
# A PV is also created when hostPath.enabled is true (for development/single-node use only).
# -- PersistentVolumeClaim for model data at /app/working-data.
persistence:
  create: false
  storageClassName:
  storageRequests: 1Gi
  storageCapacity: 1Gi
  hostPath:
    enabled: false
    # path:
    # type:

## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#nodeselector
## Ref: https://kubernetes.io/docs/user-guide/node-selection/
# -- Node selector.
nodeSelector: {}

## Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
# -- Tolerations.
tolerations: []

## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
# -- Affinity rules.
affinity: {}

## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
# -- Pod spread across zones or nodes. An entry without labelSelector defaults to this component's pods.
topologySpreadConstraints: []

# Network policy settings
networkPolicy:
  # -- Create NetworkPolicy resources. Only explicitly allowed traffic is permitted.
  enabled: false
  # -- Default-deny all ingress and egress before more specific rules apply.
  denyAll: false
  # -- Node IP ranges allowed to reach pods. Required for kubelet probes when enabled.
  nodeCIDR: []
    # - ipBlock:
    #     cidr: 0.0.0.0/0
  # -- Namespace running cluster DNS, matched on kubernetes.io/metadata.name.
  dnsNamespace: kube-system
  # -- Destination ports the server may reach. Defaults cover HTTP and HTTPS only — add your tracker store, broker and model storage ports.
  egressPorts:
    - port: 443
      protocol: TCP
    - port: 80
      protocol: TCP
  # -- Peers allowed to reach the server port. Required with denyAll; nodeCIDR only covers kubelet probes.
  allowIngressFrom: []
    # - namespaceSelector:
    #     matchLabels:
    #       kubernetes.io/metadata.name: ingress-nginx

# Defines global settings for all resources
global:
  # See: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  extraDeploymentLabels: {}
  # -- Sets the host of every ingress rule. Overrides rasa.ingress.hosts[*].host rather than acting as a fallback.
  ingressHost:
  # -- Annotations added to the ingress. Merged with rasa.ingress.annotations, which wins.
  ingressAnnotations: {}
  # -- Ingress class. Used only when rasa.ingress.className is empty.
  ingressClassName: ""

# -- Let the pod use the node network namespace.
hostNetwork: false

# -- Pod-level hostname resolution overrides.
hostAliases: []
# - ip: 127.0.0.1
#   hostnames:
#   - "localhost"

## ref: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-s-dns-policy
# -- Pod DNS policy.
dnsPolicy: ""

## ref: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-dns-config
# -- Pod DNS config.
dnsConfig:
  {}
  # options:
  # - name: ndots
  #   value: "1"

# -- Annotations on all Rasa deployments.
deploymentAnnotations: {}
  #  key: "value"

# -- Labels on all Rasa deployments.
deploymentLabels: {}

# -- Labels on all Rasa pods.
podLabels: {}
