{{- if .Values.rasa.mountDefaultConfigmap }}
{{- $integrations := include "rasa.hasIntegrations" . }}
{{- /*
Emit nothing when there is no configuration to ship: the same predicate drives
the volume and the mount, so an empty ConfigMap would never be referenced.
*/ -}}
{{- if $integrations }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rasa.fullname" . }}-configmap
  labels:
    {{- include "rasa.labels" . | nindent 4 }}
data:
  integrations: |
    {{- $integrations | nindent 4 }}
{{- end }}
{{- end }}
