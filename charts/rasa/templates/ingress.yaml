{{- if and .Values.rasa.enabled .Values.rasa.ingress.enabled -}}
{{- $fullName := include "rasa.fullname" . -}}
{{- $svcPort := .Values.rasa.service.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "rasa.labels" . | nindent 4 }}
    {{- if .Values.rasa.ingress.labels }}
{{ toYaml .Values.rasa.ingress.labels | indent 4 }}
    {{- end }}
  {{- $annotations := merge (.Values.rasa.ingress.annotations | default dict | deepCopy) (.Values.global.ingressAnnotations | default dict) }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- $className := .Values.rasa.ingress.className | default .Values.global.ingressClassName }}
  {{- if $className }}
  ingressClassName: {{ $className }}
  {{- end }}
  {{- if .Values.rasa.ingress.tls }}
  tls:
    {{- range .Values.rasa.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  {{- if not .Values.rasa.ingress.hosts }}
  {{- /*
  An ingress with no rules routes nothing. Fail rather than emit `rules: null`,
  which the API server accepts and silently does nothing with.
  */}}
  {{- fail "rasa.ingress.enabled is true but rasa.ingress.hosts is empty, so the ingress would route nothing. Add at least one host and path, or set rasa.ingress.enabled=false and manage routing yourself." }}
  {{- end }}
  rules:
    {{- range .Values.rasa.ingress.hosts }}
    - host: {{ $.Values.global.ingressHost | default .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if .pathType }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
          {{- if .extraPaths }}
          {{- range .extraPaths }}
          - path: {{ .path }}
            {{- if .pathType }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              service:
                name: {{ .serviceName }}
                port:
                  number: {{ .servicePort }}
          {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
