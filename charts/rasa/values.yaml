# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- nameOverride overrides the name used for chart resources. Defaults to the chart name.
nameOverride: ""
# -- fullnameOverride overrides the fully-qualified name prefix used for all chart resources.
fullnameOverride: ""

# -- imagePullSecrets contains references to Secrets for pulling images from private registries.
imagePullSecrets: []
  # - name: regcred

# -- rasaProLicense references the Kubernetes Secret that holds your Rasa Pro license key. Required for all Rasa Pro deployments.
rasaProLicense:
  secretName: "rasa-secrets"
  secretKey: "rasaProLicense"

# Rasa Pro Image
rasa:
  # -- rasa.enabled enables the Rasa Pro server deployment.
  enabled: true

  # -- rasa.replicaCount specifies number of replicas
  replicaCount: 1
  # rasa.image defines image settings
  image:
    # -- image.repository specifies image repository
    repository: "europe-west3-docker.pkg.dev/rasa-releases/rasa-pro/rasa-pro"
    # -- image.pullPolicy specifies image pull policy
    pullPolicy: IfNotPresent
    # -- image.tag overrides the Rasa Pro image tag. Empty (default) uses the chart's
    # appVersion. Set an exact, immutable tag to pin deployments independently of chart
    # upgrades.
    tag: ""

  # -- rasa.strategy specifies deployment strategy type
  ## ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  strategy: {}
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 1
  #     maxUnavailable: 0

  settings:
    # -- settings.debugMode enables debug mode
    debugMode: false
    # -- settings.port defines port on which Rasa runs
    port: 5005
    # -- settings.scheme defines scheme by which the service are accessible
    scheme: http
    # -- settings.enableApi enables the Rasa HTTP API in addition to the configured input channel. Required for most integrations. Supports token-based auth (authToken) or JWT auth (jwtSecret + jwtMethod).
    enableApi: true
    # -- settings.authToken references the Kubernetes Secret containing the static bearer token used to authenticate API requests.
    # Unset by default: with settings.enableApi true and neither authToken nor jwtSecret set, the HTTP API accepts unauthenticated requests.
    authToken:
      # secretName: "rasa-secrets"
      # secretKey: "authToken"
    # -- settings.jwtSecret references the Kubernetes Secret containing the JWT secret used to verify signed tokens for API authentication.
    # Unset by default. Set this together with settings.jwtMethod to authenticate API requests with signed JWTs instead of a static token.
    jwtSecret:
      # secretName: "rasa-secrets"
      # secretKey: "jwtSecret"
    # -- settings.allowUnauthenticatedApi acknowledges serving an unauthenticated API behind an ingress. Rendering an ingress fails when settings.enableApi is true and neither authToken nor jwtSecret is set; set this to true when something in front of the chart already authenticates callers.
    allowUnauthenticatedApi: false
    # -- settings.jwtMethod is JWT algorithm to be used
    jwtMethod: HS256
    # -- settings.cors sets the allowed CORS origin for the Rasa API. Defaults to '*' (all origins). Restrict to specific domains in production.
    cors: '*'
    # -- settings.useDefaultArgs controls whether the chart injects default Rasa startup arguments. Keep true for standalone Rasa Pro deployments. Only disable when deploying as part of Rasa Studio.
    useDefaultArgs: true
    # -- settings.mountDefaultConfigmap controls whether the chart mounts a ConfigMap containing credentials.yml and endpoints.yml into the Rasa container.
    # When false, credentials and endpoints must be available at /.config or baked into the image.
    mountDefaultConfigmap: true
    # -- settings.mountModelsVolume controls whether the chart mounts a volume for Rasa models at /app/models.
    # When false, models must be available at /app/models or baked into the image.
    mountModelsVolume: true
    # -- settings.credentials enables credentials configuration for channel connectors
    ## See: https://rasa.com/docs/reference/channels/messaging-and-voice-channels
    credentials: {}
      # rest:
      # facebook:
      #   verify: "rasa"
      #   secret: "<SECRET>"
      #   page-access-token: "<PAGE-ACCESS-TOKEN>"

    # -- settings.credentialsRaw accepts a raw YAML string (e.g. the contents of a credentials.yml file)
    # that is parsed and deep-merged with settings.credentials. The structured value wins on key conflicts.
    # Intended for `helm install --set-file rasa.settings.credentialsRaw=./credentials.yml`
    # or ArgoCD multi-source `fileParameters` referencing `$values/credentials.yml`.
    # Leave unset/empty to disable. Malformed YAML fails the template render.
    credentialsRaw: ""

    # See: https://rasa.com/docs/rasa/telemetry/telemetry/
    telemetry:
      # -- telemetry.enabled allow Rasa to collect anonymous usage details
      enabled: true
      # -- telemetry.debug prints telemetry data to stdout
      debug: false

    # Not all parameters are mandatory
    # -- settings.endpoints enables endpoints configuration for the Rasa deployment.
    # See: https://rasa.com/docs/pro/build/configuring-assistant#endpoints
    endpoints: {}
      # -- endpoints.models is where the models are pulled from.
      # See: https://rasa.com/docs/reference/integrations/model-storage
      # models:
      #   url: http://my-server.com/models/default_core@latest
        # wait_time_between_pulls:  10   # [optional](default: 100)

    # -- settings.endpointsRaw accepts a raw YAML string (e.g. the contents of an endpoints.yml file)
    # that is parsed and deep-merged with settings.endpoints. The structured value wins on key conflicts,
    # so infra-owned blocks (tracker_store, event_broker) defined in settings.endpoints take precedence
    # over the same keys in the raw file.
    # Intended for `helm install --set-file rasa.settings.endpointsRaw=./endpoints.yml`
    # or ArgoCD multi-source `fileParameters` referencing `$values/endpoints.yml`.
    # Leave unset/empty to disable. Malformed YAML fails the template render.
    endpointsRaw: ""

      # --endpoints.action_endpoint is a server which runs your custom actions.
      # See: https://rasa.com/docs/reference/integrations/action-server/actions
      # action_endpoint:
      #   actions_module: "actions"

      # -- endpoints.tracker_store is used to store the conversations.
      # By default the conversations are stored in memory.
      # See: https://rasa.com/docs/reference/integrations/tracker-stores
      # tracker_store:
      #    type: redis
      #    url: <host of the redis instance, e.g. localhost>
      #    port: <port of your redis instance, usually 6379>
      #    db: <number of your database within redis, e.g. 0>
      #    password: <password used for authentication>
      #    use_ssl: <whether or not the communication is encrypted, default false>

      # -- endpoints.event_broker allows you to connect your running assistant to other services that process the data which all conversation events should be streamed to
      # See: https://rasa.com/docs/reference/integrations/event-brokers
      # event_broker:
      #   type: kafka
      #   url: localhost:9095
      #   sasl_mechanism: SCRAM-SHA-512
      #   security_protocol: SASL_PLAINTEXT
      #   sasl_username: testuser
      #   sasl_password: testpass123
      #   partition_by_sender: true
      #   client_id: rasa-broker

      # -- endpoints.model_groups is used to define multiple models under a single ID which can be accessed by any component.
      # Ensure the OPENAI_API_KEY is set to prevent any missing API key errors.
      # See: https://rasa.com/docs/reference/config/components/llm-configuration#model-groups
      # model_groups:
      #   - id: openai-gpt-4o
      #     models:
      #       - provider: openai
      #         model: gpt-4o-2024-11-20
      #         request_timeout: 7
      #         max_tokens: 256
      #   - id: openai-embeddings
      #     models:
      #       - provider: openai
      #         model: text-embedding-3-large

    # -- settings.environment sets the Rasa runtime environment. Use 'production' to disable certain development-only defaults.
    environment: development
    # settings.logging sets log levels for Rasa and external libraries
    # See: https://rasa.com/docs/rasa/next/command-line-interface/#log-level
    logging:
      # -- logging.logLevel is Rasa Log Level
      logLevel: info
  # -- rasa.args overrides the default arguments for the container
  args: []
  # -- rasa.additionalArgs adds additional arguments to the default args
  additionalArgs: []
  # -- rasa.command overrides the default command for the container
  command: []
  # -- rasa.overrideEnv overrides all default environment variables
  overrideEnv: []
  # -- rasa.additionalEnv adds additional environment variables
  additionalEnv: []
    # - name: SOME_CUSTOM_ENV_VAR
    #   value: "custom value"
    # - name: SOME_CUSTOM_ENV_VAR_FROM_SECRET
    #   valueFrom:
    #     secretKeyRef:
    #       name:
    #       key:

  # -- rasa.envFrom is used to add environment variables from ConfigMap or Secret
  envFrom: []
    # - configMapRef:
    #     name: my-configmap

  # -- rasa.initContainers allows to specify init containers for the Rasa deployment
  ## Ref: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
  ## <PATH_TO_INITIAL_MODEL> has to be a URL (without auth) that points to a tar.gz file
  initContainers: []
    # - name: initial-model
    #   image: "alpine"
    #   command: ["/bin/sh", "-c"]
    #   args:
    #     - cd /app/models/ && wget <PATH_TO_INITIAL_MODEL> -O model.tar.gz
    #   volumeMounts:
    #     - mountPath: /app/models
    #       name: models

  # -- rasa.additionalContainers allows to specify additional containers for the Rasa Deployment
  additionalContainers: []
    # - name: extra
    #   image: "busybox"
    #   command: ["bash", "-c"]

  # -- rasa.volumes specify additional volumes to mount in the Rasa container
  ## Ref: https://kubernetes.io/docs/concepts/storage/volumes/
  volumes: []
  #   - hostPath:
  #       path: <HOST_PATH>
  #     name: <VOLUME_NAME>

  # -- rasa.volumeMounts specifies additional volumes to mount in the Rasa container
  volumeMounts: []
    # - name: <VOLUME_NAME>
    #   mountPath: <CONTAINER_PATH>
    #   readOnly: true

  # -- rasa.serviceAccount defines service account
  serviceAccount:
    # -- serviceAccount.create specifies whether a service account should be created
    create: true
    # -- serviceAccount.annotations defines annotations to add to the service account
    annotations: {}
    # -- serviceAccount.name is the name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  # -- (int) rasa.terminationGracePeriodSeconds is the pod-level grace period Kubernetes waits after SIGTERM before sending SIGKILL. Leave unset to use the Kubernetes default of 30
  terminationGracePeriodSeconds:

  # -- rasa.podAnnotations defines annotations to add to the pod
  podAnnotations: {}
    # container.apparmor.security.beta.kubernetes.io/rasa: runtime/default

  # -- rasa.podSecurityContext defines pod security context
  podSecurityContext:
    enabled: true
    # fsGroup: 2000

  # -- rasa.automountServiceAccountToken determines whether the Rasa Pro pod is given a
  # Kubernetes API token at /var/run/secrets/kubernetes.io/serviceaccount. Rasa Pro never
  # calls the Kubernetes API and this chart grants no RBAC, so the token is left out.
  # Set it to true if you add a sidecar via rasa.additionalContainers that needs one.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
  automountServiceAccountToken: false

  # -- rasa.containerSecurityContext defines security context that allows you to overwrite the container-level security context
  # The defaults below satisfy the restricted Pod Security Standard.
  # Ref: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
  containerSecurityContext:
    enabled: true
    # -- rasa.containerSecurityContext.allowPrivilegeEscalation determines whether to allow privilege escalation.
    allowPrivilegeEscalation: false
    # -- rasa.containerSecurityContext.capabilities defines the Linux capabilities configuration.
    capabilities:
      # -- rasa.containerSecurityContext.capabilities.drop defines capabilities to drop from the container.
      drop:
        - ALL
    # -- rasa.containerSecurityContext.runAsNonRoot determines whether to run the container as a non-root user.
    # REQUIRES an image whose USER is a numeric non-root uid. The stock rasa-pro image is
    # USER 1001 and satisfies this. If you point rasa.image.repository at a custom image
    # that runs as root, or whose USER is a name rather than a number, the pod will fail
    # with CreateContainerConfigError. Fix the image, or set this to false — in which case
    # the deployment will not satisfy the restricted Pod Security Standard.
    runAsNonRoot: true
    # -- rasa.containerSecurityContext.seccompProfile defines the seccomp profile configuration.
    seccompProfile:
      # -- rasa.containerSecurityContext.seccompProfile.type is the seccomp profile type.
      type: RuntimeDefault

  # -- rasa.service configures the Kubernetes Service exposing the Rasa Pro server.
  service:
    # -- service.type is used to specify service type
    type: ClusterIP
    # -- service.port is used to specify service port
    port: 5005
    # -- service.targetPort is the container port that Service traffic is forwarded to. Should match settings.port.
    targetPort: 5005
    # -- service.annotations defines annotations to add to the service
    annotations: {}
    # -- service.nodePort is used to specify the nodePort(s) value(s) for the LoadBalancer and NodePort service types
    ## Ref: https://kubernetes.io/docs/concepts/services-networking/service/#nodeport
    nodePort:
    # -- service.loadBalancerIP exposes the Service externally using a cloud provider's load balancer
    ## Ref: https://kubernetes.io/docs/concepts/services-networking/service/#loadbalancer
    loadBalancerIP:
    # -- service.externalTrafficPolicy enables client source IP preservation
    ## Ref: http://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip
    externalTrafficPolicy: Cluster

  # rasa.livenessProbe is used to override default liveness probe settings
  livenessProbe:
    # -- livenessProbe.enabled is used to enable or disable liveness probe
    enabled: true
    # -- livenessProbe.httpGet is used to define HTTP request
    httpGet:
      path: /
      port: 5005
      scheme: HTTP
    # -- livenessProbe.initialDelaySeconds defines wait time in seconds before performing the first probe
    initialDelaySeconds: 15
    # -- livenessProbe.periodSeconds specifies that the kubelet should perform a liveness probe every X seconds
    periodSeconds: 15
    # -- livenessProbe.successThreshold is the minimum consecutive successes required before the probe is considered successful after a failure
    successThreshold: 1
    # -- livenessProbe.timeoutSeconds defines number of seconds after which the probe times out
    timeoutSeconds: 5
    # -- livenessProbe.failureThreshold defines after how many failures container is considered unhealthy
    failureThreshold: 6
    # -- livenessProbe.terminationGracePeriodSeconds is an optional duration in seconds the pod needs to terminate gracefully after a liveness probe failure
    terminationGracePeriodSeconds: 30

  # rasa.readinessProbe is used to override default readiness probe settings
  readinessProbe:
    # -- readinessProbe.enabled is used to enable or disable readinessProbe
    enabled: true
    # -- readinessProbe.httpGet is used to define HTTP request
    httpGet:
      path: /
      port: 5005
      scheme: HTTP
    # -- readinessProbe.initialDelaySeconds defines wait time in seconds before performing the first probe
    initialDelaySeconds: 15
    # -- readinessProbe.periodSeconds specifies that the kubelet should perform a liveness probe every X seconds
    periodSeconds: 15
    # -- readinessProbe.successThreshold is the minimum consecutive successes required before the probe is considered successful after a failure
    successThreshold: 1
    # -- readinessProbe.timeoutSeconds defines number of seconds after which the probe times out
    timeoutSeconds: 5
    # -- readinessProbe.failureThreshold defines after how many failures container is considered unhealthy
    failureThreshold: 6

  # -- rasa.lifecycle defines container lifecycle hooks (postStart / preStop) for the Rasa container
  ## Ref: https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/
  lifecycle: {}
    # preStop:
    #   exec:
    #     command: ["/bin/sh", "-c", "sleep 10"]
    # postStart:
    #   exec:
    #     command: ["/bin/sh", "-c", "echo started"]

  # Configure the ingress resource that allows you to access the deployment installation.
  ## ref: http://kubernetes.io/docs/user-guide/ingress/
  ingress:
    # -- ingress.enabled specifies whether an ingress service should be created
    enabled: false
    # -- ingress.className specifies the ingress className to be used
    className: ""
    # -- ingress.labels defines labels to add to the ingress
    labels: {}
    # -- ingress.annotations defines annotations to add to the ingress
    annotations:
      {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    # -- ingress.hosts specifies the hosts for this ingress
    hosts:
      - host: INGRESS.HOST.NAME
        paths:
          - path: /api
            pathType: Prefix
        extraPaths: []
    # -- ingress.tls specifies the TLS configuration for ingress. Not derived from global.ingressHost. List every host explicitly and keep it in sync with ingress.hosts, otherwise the ingress serves a host the certificate does not cover.
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  # -- rasa.resources specifies the resources limits and requests
  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # rasa.autoscaling specifies the HPA settings
  autoscaling:
    # -- autoscaling.enabled specifies whether autoscaling should be enabled
    enabled: false
    # -- autoscaling.minReplicas specifies the minimum number of replicas
    minReplicas: 1
    # -- autoscaling.maxReplicas specifies the maximum number of replicas
    maxReplicas: 100
    # -- autoscaling.targetCPUUtilizationPercentage specifies the target CPU/Memory utilization percentage
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # rasa.persistence creates a PVC for model storage. Only supported when running Rasa Pro as a model service for Studio.
  # Note: the PVC name is scoped to the namespace, so only one release per namespace can use persistence at a time.
  # A PV is also created when hostPath.enabled is true (for development/single-node use only).
  persistence:
    create: false
    storageClassName:
    storageRequests: 1Gi
    storageCapacity: 1Gi
    hostPath:
      enabled: false
      # path:
      # type:

  # -- rasa.nodeSelector allows the deployment to be scheduled on selected nodes
  ## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#nodeselector
  ## Ref: https://kubernetes.io/docs/user-guide/node-selection/
  nodeSelector: {}

  # -- rasa.tolerations defines tolerations for pod assignment
  ## Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
  tolerations: []

  # -- rasa.affinity allows the deployment to schedule using affinity rules
  ## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
  affinity: {}

  # -- rasa.topologySpreadConstraints controls how pods are spread across topology domains such as zones or nodes. An entry that omits labelSelector defaults to this component's own pods.
  ## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
  topologySpreadConstraints: []

# Network policy settings
networkPolicy:
  # -- networkPolicy.enabled enables Kubernetes NetworkPolicy resources for the Rasa Pro server. When true, only explicitly allowed traffic is permitted.
  enabled: false
  # -- networkPolicy.denyAll applies a default-deny NetworkPolicy that blocks all ingress and egress traffic before more specific rules are applied.
  denyAll: false
  # -- networkPolicy.nodeCIDR specifies node IP ranges allowed to reach pods. Required to allow kubelet liveness and readiness probes when networkPolicy.enabled is true.
  nodeCIDR: []
    # - ipBlock:
    #     cidr: 0.0.0.0/0

# Defines global settings for all resources
global:
  # -- global.additionalDeploymentLabels adds extra labels to all Deployment resources. Useful for mapping organizational structures onto Kubernetes objects.
  # See: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  additionalDeploymentLabels: {}
  # -- global.ingressHost sets the host of every rule in the Rasa Pro server ingress. Unlike the other global ingress settings it overrides rasa.ingress.hosts[*].host rather than acting as a fallback. Applies only to the rasa component.
  ingressHost:
  # -- global.ingressAnnotations defines annotations added to the Rasa Pro server ingress. Merged with rasa.ingress.annotations, which wins on key conflicts. Applies only to the rasa component.
  ingressAnnotations: {}
  # -- global.ingressClassName defines the ingress class for the Rasa Pro server ingress. Used only when rasa.ingress.className is empty. Applies only to the rasa component.
  ingressClassName: ""

# -- hostNetwork controls whether the pod may use the node network namespace
hostNetwork: false

# -- hostAliases specifies pod-level override of hostname resolution when DNS and other options are not applicable
hostAliases: []
# - ip: 127.0.0.1
#   hostnames:
#   - "localhost"

# -- dnsPolicy specifies Pod's DNS policy
## ref: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-s-dns-policy
dnsPolicy: ""

# -- dnsConfig specifies Pod's DNS config
## ref: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-dns-config
dnsConfig:
  {}
  # options:
  # - name: ndots
  #   value: "1"

# -- deploymentAnnotations defines annotations to add to all Rasa deployments
deploymentAnnotations: {}
  #  key: "value"

# -- deploymentLabels defines labels to add to all Rasa deployment
deploymentLabels: {}

# -- podLabels defines labels to add to all Rasa pod(s)
podLabels: {}
